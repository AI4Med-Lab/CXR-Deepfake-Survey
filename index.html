<!DOCTYPE html>
<!-- BUILD MARKER: v29-2026-09-16-matching-visual-polish (view-source and check this matches what you expect) -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Perception Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F6F5F1;
    --panel:#FFFFFF;
    --panel-2:#EFEDE6;
    --ink:#1B2430;
    --ink-soft:#5B6270;
    --line:#DDD8CC;
    --line-strong:#C6C0B2;
    --accent:#2F4B7C;
    --accent-hover:#1F3559;
    --accent-soft:#E7ECF4;
    --gold:#9C7A2E;
    --gold-soft:#F3ECD8;
    --success:#3F7A5C;
    --success-soft:#E4EFE8;
    --danger:#A6412F;
    --danger-soft:#F5E7E3;
    --radius:6px;
    --radius-lg:8px;
    --serif: "Spectral", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-family: var(--sans);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171C;
      --panel:#1B1F26;
      --panel-2:#20242C;
      --ink:#EDEBE4;
      --ink-soft:#9BA1AC;
      --line:#333944;
      --line-strong:#454C58;
      --accent:#7FA0D6;
      --accent-hover:#9CB6E2;
      --accent-soft:#212A38;
      --gold:#D6B15E;
      --gold-soft:#2B2517;
      --success:#7FB89A;
      --success-soft:#17251E;
      --danger:#E08A78;
      --danger-soft:#2A1A17;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171C; --panel:#1B1F26; --panel-2:#20242C; --ink:#EDEBE4; --ink-soft:#9BA1AC;
    --line:#333944; --line-strong:#454C58; --accent:#7FA0D6; --accent-hover:#9CB6E2;
    --accent-soft:#212A38; --gold:#D6B15E; --gold-soft:#2B2517; --success:#7FB89A;
    --success-soft:#17251E; --danger:#E08A78; --danger-soft:#2A1A17;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    overflow-x:auto;
  }
  #app{ max-width:1040px; margin:0 auto; padding:0 20px 70px; }

  /* ---------- header ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 2px; flex-wrap:wrap; gap:10px;
    border-bottom:1px solid var(--line); margin-bottom:20px;
  }
  .brand{
    font-family:var(--serif); font-weight:600; font-size:17px; letter-spacing:.005em;
    color:var(--ink);
  }
  .brand .brand-sub{ display:block; font-family:var(--sans); font-weight:500; font-size:11px; color:var(--ink-soft); margin-top:0; }
  .whoami{
    font-size:13px; color:var(--ink-soft);
    display:flex; align-items:center; gap:8px;
  }
  .whoami b{ color:var(--ink); font-weight:600; }

  /* ---------- surfaces ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:22px 24px;
    margin-bottom:14px;
  }
  h1{ font-family:var(--serif); font-weight:600; font-size:25px; line-height:1.2; margin:0 0 8px; letter-spacing:.001em; }
  h2{ font-family:var(--serif); font-weight:600; font-size:18px; margin:0 0 4px; }
  p.sub{ color:var(--ink-soft); margin:0 0 14px; line-height:1.45; max-width:68ch; font-size:14px; }
  label{ display:block; font-size:12px; font-weight:600; margin-bottom:4px; color:var(--ink-soft); }

  input[type=text]{
    width:100%; padding:9px 11px; border-radius:var(--radius);
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; margin-bottom:10px;
  }
  input[type=text]:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  textarea{
    width:100%; min-height:66px; padding:9px 11px; border-radius:var(--radius);
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    font-size:14px; font-family:var(--sans); resize:vertical;
  }
  select{
    width:100%; padding:8px 10px; border-radius:var(--radius);
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); font-size:14px; font-family:var(--sans);
  }

  button{
    font-family:var(--sans); cursor:pointer; border:none; border-radius:var(--radius);
    font-size:14px; font-weight:600; padding:9px 16px;
    transition:background .15s ease, opacity .15s ease, border-color .15s ease;
  }
  button:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-secondary{ background:var(--panel); color:var(--ink); border:1px solid var(--line-strong); }
  .btn-secondary:hover{ background:var(--panel-2); }
  .btn-text{ background:transparent; color:var(--accent); padding:8px 4px; }
  .link-small{ font-size:12.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; }
  .link-small:hover{ color:var(--ink); }

  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row.between{ justify-content:space-between; }
  hr.sep{ border:none; border-top:1px solid var(--line); margin:14px 0; }

  .id-box{
    border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:0 var(--radius) var(--radius) 0; background:var(--accent-soft);
    padding:9px 14px; font-size:13px; margin-bottom:14px; color:var(--ink-soft);
  }
  .id-box code{ font-family:var(--sans); font-size:14px; font-weight:700; color:var(--accent); letter-spacing:.03em; }

  /* ---------- progress rail (dashboard) ---------- */
  .progress-rail{ display:flex; align-items:center; gap:0; margin-bottom:16px; }
  .progress-rail .seg{ flex:1; height:4px; background:var(--line); }
  .progress-rail .seg.done{ background:var(--accent); }
  .progress-rail .seg:not(:last-child){ margin-right:4px; }

  .level-list{ display:flex; flex-direction:column; }
  .level-item{
    display:flex; align-items:center; gap:14px;
    padding:12px 4px; border-bottom:1px solid var(--line);
  }
  .level-item:last-child{ border-bottom:none; }
  .level-num{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    border:1.5px solid var(--line-strong); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:600; font-size:14px;
  }
  .level-num.done{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .level-info{ flex:1; min-width:0; }
  .level-info .t{ font-weight:600; font-size:14.5px; }
  .level-info .s{ font-size:12px; color:var(--ink-soft); margin-top:1px; }

  .badge{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.done{ background:var(--success-soft); color:var(--success); }
  .badge.progress{ background:var(--gold-soft); color:var(--gold); }
  .badge.todo{ background:var(--panel-2); color:var(--ink-soft); }
  .badge.danger{ background:var(--danger-soft); color:var(--danger); }

  /* ---------- task blocks (levels 2 & 3): image + controls side by side ---------- */
  .task-block{
    border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:14px; margin-bottom:10px; background:var(--paper);
    display:flex; gap:16px; align-items:flex-start;
  }
  .task-block .tb-media{ flex-shrink:0; width:320px; }
  .task-block .tb-body{ flex:1 1 320px; min-width:280px; }
  .task-block img{
    width:100%; border-radius:var(--radius);
    display:block; border:1px solid var(--line);
  }
  .task-block.stacked{ flex-direction:column; }
  .task-block.stacked .tb-body{ width:100%; min-width:0; }
  .report-text{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; font-size:14px; line-height:1.55; white-space:pre-wrap;
    max-height:360px; overflow-y:auto; font-family:var(--sans);
  }
  .choice-row{ display:flex; gap:8px; margin-bottom:8px; }
  .choice-btn{
    flex:1; padding:9px; border-radius:var(--radius); border:1.5px solid var(--line-strong);
    background:var(--panel); color:var(--ink); font-weight:600; text-align:center; font-family:var(--sans);
  }
  .choice-btn.selected-real{ border-color:var(--success); background:var(--success-soft); color:var(--success); }
  .choice-btn.selected-fake{ border-color:var(--danger); background:var(--danger-soft); color:var(--danger); }

  .checkbox-list{ display:flex; flex-direction:column; gap:6px; margin-top:2px; }
  .checkbox-item{
    display:flex; align-items:center; gap:9px; padding:8px 10px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--panel);
    font-size:13.5px; cursor:pointer;
  }
  .checkbox-item input{ width:16px; height:16px; accent-color:var(--accent); flex-shrink:0; }
  @media (max-width:700px){
    .task-block{ flex-direction:column; }
    .task-block .tb-media{ width:100%; max-width:360px; }
    .task-block .tb-body{ min-width:0; }
  }

  /* ---------- level 1: two-column matching ---------- */
  .match-grid{ display:grid; grid-template-columns:minmax(230px, 280px) 1fr; gap:20px; align-items:start; }
  .match-col-label{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; text-transform:none; }
  .match-images{ display:flex; flex-direction:column; gap:8px; }
  .match-image-card{
    border:1.5px solid var(--line); border-radius:var(--radius-lg); background:var(--paper);
    padding:9px 10px; cursor:pointer; transition:border-color .15s ease, background .15s ease;
    display:flex; gap:12px; align-items:center;
  }
  .match-image-card:hover{ border-color:var(--line-strong); background:var(--panel-2); }
  .match-image-card.active{ border-color:var(--accent); background:var(--accent-soft); }
  .match-image-card.matched{ border-color:var(--success); background:var(--success-soft); }
  .match-image-card img{ width:120px; height:120px; object-fit:cover; border-radius:6px; border:1px solid var(--line); flex-shrink:0; display:block; }
  .match-image-card .info{ flex:1; min-width:0; }
  .match-image-card .assign-note{ font-size:12px; color:var(--ink-soft); line-height:1.4; }
  .match-image-card .assign-note.matched{ color:var(--ink); font-weight:500; }
  .match-badge-overlay{
    position:absolute; bottom:6px; left:6px;
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:12px; color:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.45); border:1.5px solid rgba(255,255,255,0.35);
  }
  .status-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:6px; vertical-align:middle; background:var(--line-strong);
  }
  .status-dot.done{ background:var(--success); }
  .status-dot.active{ background:var(--accent); }
  .tap-pill{
    display:inline-block; font-size:11px; font-weight:600; color:var(--ink-soft);
    background:var(--panel-2); border:1px solid var(--line); border-radius:999px;
    padding:3px 10px;
  }
  .match-image-card.active .tap-pill, .match-image-card:hover .tap-pill{ border-color:var(--line-strong); }
  .match-num-wrap{ display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
  .match-num-wrap label{ font-size:10.5px; margin:0 0 3px; color:var(--ink-soft); font-weight:600; }
  .match-num-input{
    width:48px; padding:8px 4px; text-align:center; font-size:17px; font-weight:700;
    border-radius:var(--radius); border:1.5px solid var(--line-strong); background:var(--panel); color:var(--ink);
    margin-bottom:0;
  }
  .match-num-input.input-error{ border-color:var(--danger); background:var(--danger-soft); }
  .match-badge{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:12.5px; color:#fff;
  }
  .match-descs{ display:flex; flex-direction:column; gap:8px; }
  .match-desc-row{
    border:1.5px solid var(--line); border-radius:var(--radius-lg); background:var(--panel);
    padding:11px 12px; cursor:pointer; display:flex; gap:12px; align-items:flex-start;
    transition:border-color .15s ease, background .15s ease; font-size:13px; line-height:1.4;
  }
  .match-desc-row:hover{ border-color:var(--line-strong); background:var(--panel-2); }
  .match-desc-row.paired{ border-color:var(--success); }
  .match-desc-text{ flex:1; min-width:0; }
  .match-desc-row.awaiting{ border-style:dashed; }
  .match-slot{
    width:24px; height:24px; border-radius:50%; flex-shrink:0; margin-top:1px;
    border:1.5px dashed var(--line-strong); display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:12.5px; color:var(--ink-soft);
  }
  .match-hint{
    font-size:12px; color:var(--ink-soft); background:var(--panel-2);
    border-radius:var(--radius); padding:7px 11px; margin-bottom:10px;
  }
  @media (max-width:640px){
    .match-grid{ grid-template-columns:1fr; gap:14px; }
  }

  /* ---------- sequential task/item progress + transitions ---------- */
  .subtask-bar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:12px; }
  .subtask-label{ font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; flex-shrink:0; }
  .subtask-dots{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:6px; min-width:0; max-width:60%; }
  .subtask-dots .dot{ width:7px; height:7px; border-radius:50%; background:var(--line-strong); flex-shrink:0; }
  .subtask-dots .dot.done{ background:var(--accent); }
  .subtask-dots .dot.current{ background:var(--accent); transform:scale(1.35); }
  .subtask-progress-track{
    flex:1; max-width:220px; height:6px; background:var(--line);
    border-radius:999px; overflow:hidden; min-width:60px;
  }
  .subtask-progress-fill{
    height:100%; background:var(--accent); border-radius:999px;
    transition:width .25s ease; min-width:6px;
  }
  .task-transition{ opacity:0; transform:translateY(8px); transition:opacity .32s ease, transform .32s ease; }
  .task-transition.in{ opacity:1; transform:translateY(0); }
  .continue-bar{ display:flex; justify-content:flex-end; margin-top:4px; }
  @media (prefers-reduced-motion: reduce){
    .task-transition{ transition:none; opacity:1; transform:none; }
  }

  /* ---------- zoomable stimulus images + full-screen lightbox ---------- */
  img.zoomable{ cursor:zoom-in; }
  .zoom-wrap{ position:relative; display:inline-block; width:100%; }
  .zoom-hint{
    position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.55); color:#fff;
    width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; pointer-events:none;
  }
  .lightbox{
    display:none; position:fixed; inset:0; background:rgba(10,10,14,0.94);
    z-index:200; align-items:center; justify-content:center; padding:24px;
    cursor:zoom-out; overflow:hidden;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{
    max-width:92vw; max-height:82vh; border-radius:10px; cursor:zoom-in;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
    touch-action:none; user-select:none; -webkit-user-drag:none;
    transform-origin:center center; will-change:transform;
  }
  .lightbox-back{
    position:absolute; top:20px; left:20px; background:rgba(255,255,255,0.12);
    color:#fff; border:1px solid rgba(255,255,255,0.3); padding:10px 18px;
    font-weight:600; backdrop-filter:blur(4px);
  }
  .lightbox-back:hover{ background:rgba(255,255,255,0.22); }
  .lightbox-controls{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.12);
    padding:6px; border-radius:999px; backdrop-filter:blur(4px);
  }
  .lightbox-controls button{
    width:36px; height:36px; padding:0; border-radius:50%;
    background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.3);
    font-size:17px; font-weight:700; line-height:1;
  }
  .lightbox-controls button:hover{ background:rgba(255,255,255,0.28); }
  .lightbox-controls #lightboxZoomReset{ width:auto; padding:0 12px; font-size:12px; border-radius:999px; }

  /* ---------- editor: task-set grouping + compact image grid ---------- */
  .set-block{
    border:1.5px solid var(--line-strong); border-radius:var(--radius-lg);
    padding:12px 14px; margin-bottom:12px; background:var(--panel-2);
  }
  .editor-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:10px; margin-bottom:10px;
  }
  .editor-grid .task-block{
    flex-direction:column; margin-bottom:0; padding:10px;
  }
  .editor-grid .task-block .tb-media{ width:100%; }
  .editor-grid .task-block img{ max-height:180px; width:100%; object-fit:cover; }
  .editor-grid .task-block.full-width{ grid-column:1 / -1; }
  .editor-thumb{ width:100%; max-height:180px; object-fit:cover; border-radius:var(--radius); margin-bottom:8px; }

  .footer-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.18); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  table.results{ width:100%; border-collapse:collapse; font-size:13px; }
  table.results th, table.results td{ text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.results th{ color:var(--ink-soft); font-weight:600; font-size:11.5px; }
  .pill{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:10.5px; font-weight:600; }
  .pill.done{ background:var(--success-soft); color:var(--success); }
  .pill.todo{ background:var(--panel-2); color:var(--ink-soft); }
  .warn-banner{
    background:var(--danger-soft); color:var(--danger); padding:9px 12px;
    border-radius:var(--radius); font-size:13px; margin-bottom:10px; border:1px solid transparent;
  }
  ::placeholder{ color:var(--ink-soft); opacity:.6; }
  @media (max-width:480px){
    .card{ padding:16px; }
    h1{ font-size:21px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox"></div>

<script>
/* =========================================================================
   STUDY CONTENT CONFIG
   Replace the placeholder images (currently generated SVGs) with your real
   study stimuli. Easiest path: convert each real image to a base64 data URI
   and paste it as the `img` value below, e.g. "data:image/png;base64,...."
   ========================================================================= */
function placeholderImg(bg, shape, label){
  var shapes = {
    circle: '<circle cx="150" cy="115" r="78" fill="#fff" opacity="0.92"/>',
    square: '<rect x="72" y="38" width="156" height="156" fill="#fff" opacity="0.92"/>',
    triangle: '<polygon points="150,28 248,188 52,188" fill="#fff" opacity="0.92"/>',
    blob: '<path d="M90 60 C140 20 220 40 230 100 C240 160 190 200 130 190 C70 180 40 100 90 60 Z" fill="#fff" opacity="0.92"/>'
  };
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">' +
    '<rect width="320" height="220" fill="' + bg + '"/>' + (shapes[shape]||'') +
    '<text x="160" y="206" font-size="13" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="600">' + label + '</text></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

// Standard finding labels used as the default checkbox options for every new
// Level 3 panel, so you don't have to re-type them each time.
var STANDARD_L3_LABELS = [
  "Atelectasis","Cardiomegaly","Consolidation","Edema","Enlarged Cardiomediastinum",
  "Fracture","Lung Lesion","Lung Opacity","No Finding","Pleural Effusion",
  "Pleural Other","Pneumonia","Pneumothorax","Support Devices"
];
function buildDefaultL3Options(){
  return STANDARD_L3_LABELS.map(function(label, i){ return { id: "o" + (i+1), text: label }; });
}

// Which method (or "Real") produced each item, tagged by the researcher for
// later per-method breakdowns in exports.
var METHOD_CATEGORIES = ["CXR-IRGen", "Progemu", "Qwen", "Real"];
function categorySelectHtml(dataAttr, currentValue){

  var images = [], descriptions = [];
  for(var i=0;i<n;i++){
    images.push({ id: 's'+setNum+'img'+(i+1), img: placeholderImg(colors[i%colors.length], shapes[i%shapes.length], 'Set '+setNum+' \u00b7 '+(i+1)), correctDescId: null, category: null });

/* ---------- storage layer: Firestore with localStorage fallback for offline resilience ---------- */
function localKey(id){ return "survey_participant_" + id; }

function localSave(p){
  try{ localStorage.setItem(localKey(p.id), JSON.stringify(p)); }catch(e){}
}
function localLoad(id){
  try{
    var raw = localStorage.getItem(localKey(id));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function withAccessCode(obj){
  // Firestore rules check request.auth, not this field, but we keep it
  // on every doc for easy manual inspection in the Firebase console.
  return Object.assign({}, obj, { _study: "survey-portal" });
}
var backendOk = true; // whether the last Firestore write/read succeeded

async function persistCreate(p){
  localSave(p);
  try{
    await fbDb.collection("participants").doc(p.id).set(withAccessCode(p));
    backendOk = true;
  } catch(e){
    console.error("firestore set failed", e);
    backendOk = false;
    showToast("Couldn't save to the server \u2014 saved on this device only");
  }
}
async function persistUpdate(id, partial){
  var current = (participant && participant.id === id) ? participant : null;
  if(current){
    Object.keys(partial).forEach(function(k){
      if(typeof partial[k] === 'object' && !Array.isArray(partial[k]) && current[k]){
        current[k] = Object.assign({}, current[k], partial[k]);
      } else {
        current[k] = partial[k];
      }
    });
    current.updatedAt = Date.now();
    localSave(current);
  }
  try{
    await fbDb.collection("participants").doc(id).set(Object.assign({}, partial, {updatedAt: Date.now()}), {merge:true});
    backendOk = true;
  } catch(e){
    console.error("firestore update failed", e);
    backendOk = false;
    showToast("Couldn't sync to the server \u2014 saved on this device only");
  }
}
async function fetchParticipant(id){
  try{
    var snap = await fbDb.collection("participants").doc(id).get();
    backendOk = true;
    if(snap.exists){ return snap.data(); }
  }catch(e){
    console.error("firestore get failed", e);
    backendOk = false;
  }
  return localLoad(id);
}
// Returns { data, error } rather than swallowing failures, so the researcher
// panel can tell "genuinely zero participants" apart from "couldn't read at all".
async function fetchAllParticipants(){

  }
}
async function deleteParticipant(id){

    return { ok: false, error: (e && e.code) || (e && e.message) || "unknown error" };

}

// Finds studyImages docs no longer referenced by any current item across all
// three levels (e.g. from renamed/replaced/removed items) and deletes them.
// Only ever compares against the currently SAVED study, never unsaved edits.
async function findUnusedImageIds(){
  var referenced = {};
  allImagesFlat(STUDY).forEach(function(im){ if(im.id) referenced[im.id] = true; });
  var qs = await fbDb.collection("studyImages").get();
  var unused = [];
  qs.forEach(function(d){ if(!referenced[d.id]) unused.push(d.id); });
  return unused;
}
async function deleteImagesByIds(ids){
  var results = await Promise.allSettled(ids.map(function(id){ return fbDb.collection("studyImages").doc(id).delete(); }));
  var failed = [];
  results.forEach(function(r, i){ if(r.status === "rejected") failed.push(ids[i]); });
  return { deleted: ids.length - failed.length, failed: failed };
}

/* ---------- survey content: stored in Firestore, editable by the researcher ---------- */
function allImagesFlat(study){
  var arr = [];
  study.level1.sets.forEach(function(set){ set.images.forEach(function(im){ arr.push(im); }); });
  study.level2.images.forEach(function(im){ if(im.type !== "text") arr.push(im); });
  study.level3.images.forEach(function(im){ arr.push(im); });
  return arr;
}

async function loadStudyConfig(){
  try{
    var snap = await fbDb.collection("studyConfig").doc("content").get();
    if(!snap.exists || !snap.data() || !snap.data().study) return;
    var study = snap.data().study;

    // Images are stored separately (one small doc each) to stay well under
    // Firestore's 1 MiB per-document limit even with several photos.
    var qs = await fbDb.collection("studyImages").get();
    var imgMap = {};
    qs.forEach(function(d){ imgMap[d.id] = d.data().dataUrl; });

    allImagesFlat(study).forEach(function(im){
      if(imgMap[im.id]) im.img = imgMap[im.id];
    });
    STUDY = study;
  }catch(e){ console.error("failed to load study config", e); }
}

async function saveStudyConfig(newStudy){
  // Split each image out into its own studyImages/{id} document, and keep
  // the main content doc small (just structure + text, no image bytes).
  var freshImages = allImagesFlat(newStudy);

  // Guard against a blank or duplicate "Item ID" field (easy to accidentally
  // clear while editing) \u2014 Firestore's .doc() throws on an empty path,
  // so repair it here rather than letting the whole save crash.
  var seenIds = {};
  var repaired = [];
  freshImages.forEach(function(im){
    var original = im.id;
    if(!im.id || !String(im.id).trim()){
      im.id = "img" + Date.now() + Math.random().toString(36).slice(2,6);
    }
    while(seenIds[im.id]){
      im.id = im.id + "-" + Math.random().toString(36).slice(2,4);
    }
    seenIds[im.id] = true;
    if(im.id !== original) repaired.push({ from: original, to: im.id });
  });

  var contentOnly = cloneStudy(newStudy);
  var writes = [];
  var strippedImages = allImagesFlat(contentOnly);
  strippedImages.forEach(function(im, i){
    im.id = freshImages[i].id; // keep the (possibly just-repaired) id in sync across both clones
    writes.push(fbDb.collection("studyImages").doc(im.id).set({ dataUrl: freshImages[i].img, updatedAt: Date.now() }));
    im.img = ""; // stripped from the content doc itself
  });
  writes.push(fbDb.collection("studyConfig").doc("content").set({ study: contentOnly, updatedAt: Date.now() }));
  await Promise.all(writes);
  STUDY = newStudy;
  return { repaired: repaired };
}

/** Resize + compress an uploaded image entirely in the browser (no backend
 *  storage needed), returning a data URL small enough for a Firestore doc. */
function fileToResizedDataUrl(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.72;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("read failed")); };
    reader.onload = function(e){
      var img = new Image();
      img.onerror = function(){ reject(new Error("decode failed")); };
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var cw = Math.max(1, Math.round(img.width * scale));
        var ch = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- full-screen image zoom (with real interactive zoom/pan) ---------- */
var zoomState = null;
function resetZoomState(){
  zoomState = { scale: 1, x: 0, y: 0, pointers: {}, lastDist: null, panStart: null };
}
function clampScale(s){ return Math.min(6, Math.max(1, s)); }
function applyZoomTransform(){
  var lb = document.getElementById("lightbox");
  var img = lb ? lb.querySelector("img") : null;
  if(!img || !zoomState) return;
  img.style.transform = "translate(" + zoomState.x + "px, " + zoomState.y + "px) scale(" + zoomState.scale + ")";
  img.style.cursor = zoomState.scale > 1.01 ? "grab" : "zoom-in";
}

function openLightbox(src){
  var lb = document.getElementById("lightbox");
  lb.innerHTML =
    '<button class="lightbox-back" id="lightboxBack">\u2190 Back</button>' +
    '<div class="lightbox-controls">' +
      '<button id="lightboxZoomOut" title="Zoom out">\u2212</button>' +
      '<button id="lightboxZoomReset" title="Reset zoom">1:1</button>' +
      '<button id="lightboxZoomIn" title="Zoom in">+</button>' +
    '</div>' +
    '<img src="' + src + '" alt="enlarged image" draggable="false"/>';
  lb.classList.add("show");
  resetZoomState();
  applyZoomTransform();

  var img = lb.querySelector("img");

  document.getElementById("lightboxBack").onclick = function(e){ e.stopPropagation(); closeLightbox(); };
  document.getElementById("lightboxZoomIn").onclick = function(e){
    e.stopPropagation();
    zoomState.scale = clampScale(zoomState.scale * 1.4);
    applyZoomTransform();
  };
  document.getElementById("lightboxZoomOut").onclick = function(e){
    e.stopPropagation();
    zoomState.scale = clampScale(zoomState.scale / 1.4);
    if(zoomState.scale <= 1.01){ zoomState.scale = 1; zoomState.x = 0; zoomState.y = 0; }
    applyZoomTransform();
  };
  document.getElementById("lightboxZoomReset").onclick = function(e){
    e.stopPropagation();
    resetZoomState();
    applyZoomTransform();
  };

  img.onclick = function(e){ e.stopPropagation(); }; // clicking the image itself shouldn't close it
  img.ondblclick = function(e){
    e.stopPropagation();
    if(zoomState.scale > 1.01){ resetZoomState(); }
    else { zoomState.scale = 2.5; }
    applyZoomTransform();
  };

  // mouse wheel / trackpad: zoom in and out
  lb.onwheel = function(e){
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.15 : (1/1.15);
    zoomState.scale = clampScale(zoomState.scale * factor);
    if(zoomState.scale <= 1.01){ zoomState.scale = 1; zoomState.x = 0; zoomState.y = 0; }
    applyZoomTransform();
  };

  // touch/pen/mouse via pointer events: drag to pan once zoomed, pinch with two fingers to zoom
  img.onpointerdown = function(e){
    zoomState.pointers[e.pointerId] = {x: e.clientX, y: e.clientY};
    var ids = Object.keys(zoomState.pointers);
    if(ids.length === 1 && zoomState.scale > 1.01){
      zoomState.panStart = {x: e.clientX - zoomState.x, y: e.clientY - zoomState.y};
      img.style.cursor = "grabbing";
    }
    if(ids.length === 2){
      var pts = ids.map(function(id){ return zoomState.pointers[id]; });
      zoomState.lastDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    }
    try{ img.setPointerCapture(e.pointerId); }catch(err){}
  };
  img.onpointermove = function(e){
    if(!zoomState.pointers[e.pointerId]) return;
    zoomState.pointers[e.pointerId] = {x: e.clientX, y: e.clientY};
    var ids = Object.keys(zoomState.pointers);
    if(ids.length === 2){
      var pts = ids.map(function(id){ return zoomState.pointers[id]; });
      var dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(zoomState.lastDist){
        zoomState.scale = clampScale(zoomState.scale * (dist / zoomState.lastDist));
      }
      zoomState.lastDist = dist;
      applyZoomTransform();
    } else if(ids.length === 1 && zoomState.panStart && zoomState.scale > 1.01){
      zoomState.x = e.clientX - zoomState.panStart.x;
      zoomState.y = e.clientY - zoomState.panStart.y;
      applyZoomTransform();
    }
  };
  function endPointer(e){
    delete zoomState.pointers[e.pointerId];
    var remaining = Object.keys(zoomState.pointers);
    if(remaining.length < 2) zoomState.lastDist = null;
    if(remaining.length === 0){ zoomState.panStart = null; applyZoomTransform(); }
  }
  img.onpointerup = endPointer;
  img.onpointercancel = endPointer;
  img.onpointerleave = endPointer;

  // clicking the dark backdrop closes it, but only when not currently zoomed in
  // (otherwise panning near the edge of the image would accidentally close it)
  lb.onclick = function(){ if(!zoomState || zoomState.scale <= 1.01) closeLightbox(); };
}
function closeLightbox(){
  var lb = document.getElementById("lightbox");
  lb.classList.remove("show");
  lb.innerHTML = "";
  lb.onwheel = null;
  lb.onclick = null;
  zoomState = null;
}
// Re-attached after every render(): any stimulus image opens the full-screen
// view instead of (or in addition to) whatever the surrounding card does.
function wireImageZoom(){
  document.querySelectorAll("[data-zoom-src]").forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation(); // don't also trigger the underlying card's select/match handler
      openLightbox(el.getAttribute("data-zoom-src"));
    };
  });
}

/* ---------- init ---------- */
async function afterAuth(){
  authReady = true;
  var email = fbAuth.currentUser ? fbAuth.currentUser.email : "";
  isResearcherSession = (email === RESEARCHER_LOGIN_EMAIL);
  await loadStudyConfig();

  if(isResearcherSession){
    var res = await fetchAllParticipants();
    researcherData = res.data;
    researcherLoadError = res.error;
    researcherTab = "results";
    screen = "researcher-panel";
    render();
    return;
  }

  var savedId = null;
  try{ savedId = localStorage.getItem("survey_last_id"); }catch(e){}
  if(savedId){
    var p = await fetchParticipant(savedId);
    if(p){ participant = p; loadDraftFromParticipant(p); screen = allDone(p) ? "complete" : "dashboard"; render(); return; }
  }
  screen = "landing";
  render();
}

async function init(){
  screen = "loading";
  render();
  document.addEventListener && document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeLightbox();
  });
  fbAuth.onAuthStateChanged(function(user){
    if(user && !authReady){ afterAuth(); }
    else if(!user && !authReady){ screen = "auth"; render(); }
  });
}

async function trySignIn(email, password){
  authError = "";
  try{
    await fbAuth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged fires afterAuth()
  }catch(e){
    authError = (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential" || e.code === "auth/invalid-login-credentials")
      ? "Incorrect passcode. Please check it and try again."
      : "Couldn't sign in (" + e.code + "). Check the Firebase config in the file.";
    render();
  }
}

function allDone(p){
  return p.level1.completed && p.level2.completed && p.level3.completed;
}

/* ---------- rendering ---------- */
function el(html){
  var d = document.createElement("div");
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function topbar(){
  if(!participant) return "";
  return '<div class="topbar">' +
    '<div class="brand">Image Perception Study<span class="brand-sub">Research survey</span></div>' +
    '<div class="row" style="gap:10px;">' +
      '<div class="whoami">' + escapeHtml(participant.name) + ' &middot; <b>' + participant.id + '</b></div>' +
      '<button class="link-small" id="switchParticipant">Not you? Switch</button>' +
    '</div>' +
    '</div>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var pendingTransition = false; // set true right before render() only by explicit "move to a different task/image" actions
function triggerEnterAnimation(id){
  var elm = document.getElementById(id);
  if(!elm) return;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ elm.classList.add("in"); });
  });
  setTimeout(function(){ if(elm) elm.classList.add("in"); }, 500); // safety net
}

function render(){
  var app = document.getElementById("app");
  var html = "";
  if(screen === "loading"){
    html = '<div class="card"><p class="sub">Loading survey\u2026</p></div>';
  } else if(screen === "auth"){
    html = renderAuthGate();
  } else if(screen === "landing"){
    html = renderLanding();
  } else if(screen === "dashboard"){
    html = topbar() + renderDashboard();
  } else if(screen === "level1" || screen === "level2" || screen === "level3"){
    html = topbar() + renderLevel(screen);
  } else if(screen === "complete"){
    html = topbar() + renderComplete();
  } else if(screen === "researcher-panel"){
    html = renderResearcherPanel();
  }
  app.innerHTML = html;
  attachHandlers();
  wireImageZoom();

  if((screen === "level1" || screen === "level2" || screen === "level3") && pendingTransition){
    triggerEnterAnimation("taskAnim");
  }
  pendingTransition = false;
}

      '<h1>Researcher Sign-In</h1>' +

function levelStatus(p, key){

  var d = p[key].draft;
  var hasAny = key === "level1" ? Object.keys(d.bySet||{}).length > 0 : Object.keys(d.answers||{}).length > 0;
  if(hasAny) return "progress";
  return "todo";
}
function statusLabel(s){ return s==="done"?"Completed":s==="progress"?"In progress":"Not started"; }

function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function subtaskBar(label, total, currentIndex){
  var DOT_THRESHOLD = 15; // beyond this, individual dots get cramped/overflow-y \u2014 a bar reads better
  var indicator;
  if(total <= DOT_THRESHOLD){
    var dots = "";
    for(var i=0;i<total;i++){
      dots += '<div class="dot' + (i<currentIndex?' done':'') + (i===currentIndex?' current':'') + '"></div>';
    }
    indicator = '<div class="subtask-dots">' + dots + '</div>';
  } else {
    var pct = total > 0 ? Math.round(((currentIndex+1) / total) * 100) : 0;
    indicator = '<div class="subtask-progress-track"><div class="subtask-progress-fill" style="width:' + pct + '%;"></div></div>';
  }
  return '<div class="subtask-bar"><div class="subtask-label">' + label + '</div>' + indicator + '</div>';
}

var MATCH_COLORS = ['#2F4B7C','#9C7A2E','#3F7A5C','#7A3F6E','#3F6E7A','#7A5C3F'];
function matchColor(i){ return MATCH_COLORS[i % MATCH_COLORS.length]; }
var activeMatchImage = null; // id of the image currently selected for pairing

function renderLevel1Body(){
  var conf = STUDY.level1;
  var sets = conf.sets;
  if(!sets || sets.length === 0){
    return '<div class="task-transition in" id="taskAnim"><p class="sub">This task hasn\u2019t been set up yet. Please check back later.</p></div>';
  }
  var si = Math.min(draftCache.level1.currentSet || 0, sets.length - 1);
  var set = sets[si];
  if(!draftCache.level1.bySet[set.id]) draftCache.level1.bySet[set.id] = {};
  var draft = draftCache.level1.bySet[set.id];

  var imgIndex = {}; set.images.forEach(function(im,i){ imgIndex[im.id]=i; });
  var reverseMap = {}; // descId -> imgId
  Object.keys(draft).forEach(function(imgId){ if(draft[imgId]) reverseMap[draft[imgId]] = imgId; });
  var matchedCount = set.images.filter(function(im){ return draft[im.id]; }).length;
  var setComplete = matchedCount === set.images.length;

  var leftCol = set.images.map(function(im, i){
    var isActive = activeMatchImage === im.id;
    var matchedDesc = draft[im.id] ? set.descriptions.filter(function(d){return d.id===draft[im.id];})[0] : null;
    var badgeColor = matchedDesc ? matchColor(i) : (isActive ? '#8A8F98' : '#5B6270');
    var noteHtml = matchedDesc
      ? '<span class="status-dot done"></span>Matched to \u201c' + escapeHtml(truncate(matchedDesc.text, 44)) + '\u201d'
      : (isActive ? '<span class="status-dot active"></span>Choose a description \u2192' : '<span class="tap-pill">Tap to match</span>');
    return '<div class="match-image-card' + (isActive?' active':'') + (matchedDesc?' matched':'') + '" data-match-img="' + im.id + '">' +
      '<div class="zoom-wrap" style="width:120px; flex-shrink:0;">' +
        '<img src="' + im.img + '" alt="stimulus image" class="zoomable" data-zoom-src="' + im.img + '" />' +
        '<span class="zoom-hint">\u2921</span>' +
        '<span class="match-badge-overlay" style="background:' + badgeColor + ';">' + (i+1) + '</span>' +
      '</div>' +
      '<div class="info">' +
        '<div class="assign-note' + (matchedDesc?' matched':'') + '">' + noteHtml + '</div>' +
      '</div>' +
    '</div>';
  }).join("");

  var rightCol = set.descriptions.map(function(d){
    var pairedImgId = reverseMap[d.id];
    var pairedIdx = pairedImgId ? imgIndex[pairedImgId] : -1;
    return '<div class="match-desc-row' + (!pairedImgId ? ' awaiting' : ' paired') + '" data-match-desc="' + d.id + '">' +
      '<div class="match-slot"' + (pairedImgId ? ' style="border-style:solid; border-color:' + matchColor(pairedIdx) + '; background:' + matchColor(pairedIdx) + '; color:#fff;"' : '') + '>' + (pairedImgId ? (pairedIdx+1) : '') + '</div>' +
      '<div class="match-desc-text">' + escapeHtml(d.text) + '</div>' +
    '</div>';
  }).join("");

  var isLastSet = si === sets.length - 1;
  var continueBtn = !isLastSet
    ? '<div class="continue-bar"><button class="btn-primary" id="continueMatchSet" ' + (setComplete?'':'disabled') + '>Continue to next matching task \u2192</button></div>'
    : "";
  var backLink = si > 0 ? '<button class="link-small" id="prevMatchSet" style="margin-bottom:14px;">&larr; Previous matching task</button>' : "";

  return subtaskBar('Matching task ' + (si+1) + ' of ' + sets.length, sets.length, si) +
  '<div class="task-transition' + (pendingTransition ? '' : ' in') + '" id="taskAnim">' +
    backLink +
    '<div class="match-hint">' + (matchedCount < set.images.length ? 'Click an image, then click the description you think matches it.' : (isLastSet ? 'All images matched \u2014 click any pair to change it.' : 'Task complete \u2014 continue when you\u2019re ready.')) + '</div>' +
    '<div class="match-grid">' +
      '<div><div class="match-col-label">Images</div><div class="match-images">' + leftCol + '</div></div>' +
      '<div><div class="match-col-label">Descriptions</div><div class="match-descs">' + rightCol + '</div></div>' +
    '</div>' +
    continueBtn +
  '</div>';
}
function truncate(s, n){ return s.length > n ? s.slice(0,n-1) + '\u2026' : s; }

function renderLevel2Body(){

function renderLevel3Body(){
  var conf = STUDY.level3;
  if(!conf.images || conf.images.length === 0){
    return '<div class="task-transition in" id="taskAnim"><p class="sub">This task hasn\u2019t been set up yet. Please check back later.</p></div>';
  }
  var idx = Math.min(draftCache.level3.currentIndex || 0, conf.images.length - 1);
  var im = conf.images[idx];
  var selected = (draftCache.level3.answers[im.id] && draftCache.level3.answers[im.id].selected) || [];
  var answered = itemIsAnswered("level3", im.id);

  var nextBtn = !isLast ? '<div class="continue-bar"><button class="btn-primary" id="nextL3" ' + (answered?'':'disabled') + '>Next image \u2192</button></div>' : "";

  var opts = im.options.map(function(o){
    var checked = selected.indexOf(o.id) > -1;
    return '<label class="checkbox-item"><input type="checkbox" data-l3-opt="' + im.id + '::' + o.id + '" ' + (checked?'checked':'') + '/> ' + escapeHtml(o.text) + '</label>';
  }).join("");

  return subtaskBar('Image ' + (idx+1) + ' of ' + conf.images.length, conf.images.length, idx) +

    backLink +
    '<div class="task-block">' +
      '<div class="tb-media"><div class="zoom-wrap"><img src="' + im.img + '" alt="stimulus image" class="zoomable" data-zoom-src="' + im.img + '" /><span class="zoom-hint">\u2921</span></div></div>' +
      '<div class="tb-body">' +
        '<label>Select all relevant option(s)</label>' +
        '<div class="checkbox-list">' + opts + '</div>' +
      '</div>' +
    '</div>' +
    nextBtn +
  '</div>';
}

function levelIsComplete(key){
  var conf = STUDY[key];
  var draft = draftCache[key];
  if(key === "level1"){
    return conf.sets.every(function(set){
      var answers = draft.bySet[set.id] || {};
      return set.images.every(function(im){ return !!answers[im.id]; });
    });
  }
  if(key === "level2"){
    return conf.images.every(function(im){
      var d = draft.answers[im.id];
      return d && d.verdict && d.reasoning && d.reasoning.trim().length >= 3;
    });
  }
  if(key === "level3"){
    return conf.images.every(function(im){
      var d = draft.answers[im.id];
      return d && d.selected && d.selected.length > 0;
    });
  }
  return false;
}
function itemIsAnswered(key, imgId){
  var draft = draftCache[key].answers;
  var d = draft[imgId];
  if(key === "level2") return !!(d && d.verdict && d.reasoning && d.reasoning.trim().length >= 3);
  if(key === "level3") return !!(d && d.selected && d.selected.length > 0);
  return false;
}
