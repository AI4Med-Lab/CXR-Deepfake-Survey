/* ---------- scoring against researcher-defined correct answers ---------- */
function scoreLevel1(p, categoryFilter){
  var correct = 0, total = 0;
  var bySet = (p.level1.draft && p.level1.draft.bySet) || {};
  STUDY.level1.sets.forEach(function(set){
    var answers = bySet[set.id] || {};
    set.images.forEach(function(im){
      if(categoryFilter && im.category !== categoryFilter) return;
      if(im.correctDescId){
        total++;
        if(answers[im.id] === im.correctDescId) correct++;
      }
    });
  });
  return { correct: correct, total: total };
}
function scoreLevel2(p, categoryFilter){
  var correct = 0, total = 0;
  var answers = (p.level2.draft && p.level2.draft.answers) || {};
  STUDY.level2.images.forEach(function(im){
    if(categoryFilter && im.category !== categoryFilter) return;
    if(im.correctVerdict){
      total++;
      var a = answers[im.id];
      if(a && a.verdict === im.correctVerdict) correct++;
    }
  });
  return { correct: correct, total: total };
}
function scoreLevel3(p, categoryFilter){
  var correct = 0, total = 0;
  var answers = (p.level3.draft && p.level3.draft.answers) || {};
  STUDY.level3.images.forEach(function(im){
    if(categoryFilter && im.category !== categoryFilter) return;
    if(im.correctOptions && im.correctOptions.length){
      total++;
      var a = answers[im.id];
      var sel = (a && a.selected) || [];
      var same = sel.length === im.correctOptions.length && sel.every(function(s){ return im.correctOptions.indexOf(s) > -1; });
      if(same) correct++;
    }
  });
  return { correct: correct, total: total };
}
function formatScore(s){ return s.total > 0 ? (s.correct + "\u2044" + s.total + " (" + Math.round(100*s.correct/s.total) + "%)") : "\u2014"; }
function scoreBadgeClass(s){
  if(s.total === 0) return "todo";
  var frac = s.correct / s.total;
  return frac >= 0.8 ? "done" : frac >= 0.5 ? "progress" : "danger";
}
function isItemCorrect(kind, im, answerValue){
  // returns true/false/null (null = no correct answer defined for this item)
  if(kind === "l1"){ if(!im.correctDescId) return null; return answerValue === im.correctDescId; }
  if(kind === "l2"){ if(!im.correctVerdict) return null; return answerValue === im.correctVerdict; }
  if(kind === "l3"){
    if(!im.correctOptions || !im.correctOptions.length) return null;
    var sel = answerValue || [];
    return sel.length === im.correctOptions.length && sel.every(function(s){ return im.correctOptions.indexOf(s) > -1; });
  }
  return null;
}

function labelForDesc(set, descId){
  var d = set.descriptions.filter(function(x){return x.id===descId;})[0];
  return d ? d.text : descId;
}
function labelForOpt(imgId, optId){
  var im = STUDY.level3.images.filter(function(x){return x.id===imgId;})[0];
  if(!im) return optId;
  var o = im.options.filter(function(x){return x.id===optId;})[0];
  return o ? o.text : optId;
}
function formatDetail(p){
  var out = '<div style="font-size:13px; line-height:1.6;">';
  out += '<div style="margin-bottom:10px;"><b>' + escapeHtml(p.name) + '</b> &middot; ' + p.id +
    '<br/><span style="color:var(--ink-soft);">Started ' + new Date(p.createdAt).toLocaleString() + '</span></div>';

  function answerChip(text, correctness){
    var style = correctness === true ? 'background:var(--success-soft); color:var(--success);'
      : correctness === false ? 'background:var(--danger-soft); color:var(--danger);'
      : '';
    return '<span style="' + style + ' padding:1px 6px; border-radius:5px;">' + text + '</span>';
  }

  var s1 = scoreLevel1(p);
  out += '<div style="margin-bottom:12px;"><b>Level 1 \u2014 Matching</b>' + (p.level1.completed ? ' <span class="pill done">Done</span>' : ' <span class="pill todo">Pending</span>') + ' \u00b7 Score: ' + formatScore(s1) + '<br/>';
  var d1 = (p.level1.draft && p.level1.draft.bySet) || {};
  STUDY.level1.sets.forEach(function(set, si){
    out += '<i>Task ' + (si+1) + '</i><br/>';
    var setAnswers = d1[set.id] || {};
    set.images.forEach(function(im, i){
      var given = setAnswers[im.id];
      var correctness = isItemCorrect("l1", im, given);
      var text = given ? escapeHtml(labelForDesc(set, given)) : '<i style="color:var(--ink-soft);">no answer</i>';
      out += '&nbsp;&nbsp;' + (i+1) + '. Image ' + im.id + ' \u2192 ' + answerChip(text, correctness) + '<br/>';
    });
  });
  out += '</div>';

  var s2 = scoreLevel2(p);
  out += '<div style="margin-bottom:12px;"><b>Level 2 \u2014 Real/Fake</b>' + (p.level2.completed ? ' <span class="pill done">Done</span>' : ' <span class="pill todo">Pending</span>') + ' \u00b7 Score: ' + formatScore(s2) + '<br/>';
  var d2 = (p.level2.draft && p.level2.draft.answers) || {};
  STUDY.level2.images.forEach(function(im, i){
    var a = d2[im.id];
    var correctness = isItemCorrect("l2", im, a ? a.verdict : null);
    var text = a && a.verdict ? '<b>' + a.verdict.toUpperCase() + '</b>: ' + escapeHtml(a.reasoning||'') : '<i style="color:var(--ink-soft);">no answer</i>';
    out += (i+1) + '. Image ' + im.id + ' \u2192 ' + answerChip(text, correctness) + '<br/>';
  });
  out += '</div>';

  var s3 = scoreLevel3(p);
  out += '<div><b>Level 3 \u2014 Options</b>' + (p.level3.completed ? ' <span class="pill done">Done</span>' : ' <span class="pill todo">Pending</span>') + ' \u00b7 Score: ' + formatScore(s3) + '<br/>';
  var d3 = (p.level3.draft && p.level3.draft.answers) || {};
  STUDY.level3.images.forEach(function(im, i){
    var a = d3[im.id];
    var sel = (a && a.selected) || [];
    var correctness = isItemCorrect("l3", im, sel);
    var text = sel.length ? escapeHtml(sel.map(function(o){return labelForOpt(im.id,o);}).join(", ")) : '<i style="color:var(--ink-soft);">no answer</i>';
    out += (i+1) + '. Image ' + im.id + ' \u2192 ' + answerChip(text, correctness) + '<br/>';
  });
  out += '</div></div>';
  return out;
}

function downloadBlob(filename, content, mime){
  var blob = new Blob([content], {type: mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ---------- structured export: one column per image + a score column per section ---------- */
function buildResultsMatrix(list, categoryFilter){
  var headers = ["Name", "ID"];
  var colSpecs = [];

  STUDY.level1.sets.forEach(function(set, si){
    set.images.forEach(function(im, i){
      if(categoryFilter && im.category !== categoryFilter) return;
      var correctLabel = "not set";
      if(im.correctDescId){
        var ci = set.descriptions.findIndex(function(d){ return d.id === im.correctDescId; });
        if(ci > -1) correctLabel = String(ci + 1);
      }
      headers.push("T" + (si+1) + " Image " + (i+1) + " [correct: " + correctLabel + "]");
      colSpecs.push(function(p){
        var answers = (p.level1.draft && p.level1.draft.bySet && p.level1.draft.bySet[set.id]) || {};
        var given = answers[im.id];
        var text = "";
        if(given){
          var gi = set.descriptions.findIndex(function(d){ return d.id === given; });
          text = gi > -1 ? String(gi + 1) : "";
        }
        return { text: text, correctness: isItemCorrect("l1", im, given) };
      });
    });
  });
  headers.push("Level 1 Score");
  colSpecs.push(function(p){ var s = scoreLevel1(p, categoryFilter); return { text: formatScore(s), isScore:true, frac: s.total ? s.correct/s.total : null }; });

  STUDY.level2.images.forEach(function(im, i){
    if(categoryFilter && im.category !== categoryFilter) return;
    var correctLabel = im.correctVerdict ? im.correctVerdict : "not set";
    headers.push("Image " + (i+1) + " (Real/Fake) [correct: " + correctLabel + "]");
    colSpecs.push(function(p){
      var answers = (p.level2.draft && p.level2.draft.answers) || {};
      var a = answers[im.id];
      return { text: a && a.verdict ? a.verdict : "", correctness: isItemCorrect("l2", im, a ? a.verdict : null) };
    });
  });
  headers.push("Level 2 Score");
  colSpecs.push(function(p){ var s = scoreLevel2(p, categoryFilter); return { text: formatScore(s), isScore:true, frac: s.total ? s.correct/s.total : null }; });

  STUDY.level3.images.forEach(function(im, i){
    if(categoryFilter && im.category !== categoryFilter) return;
    var correctLabel = (im.correctOptions && im.correctOptions.length)
      ? im.correctOptions.map(function(oid){ return labelForOpt(im.id, oid); }).join(", ")
      : "not set";
    headers.push("Image " + (i+1) + " Selected [correct: " + correctLabel + "]");
    colSpecs.push(function(p){
      var answers = (p.level3.draft && p.level3.draft.answers) || {};
      var a = answers[im.id];
      var sel = (a && a.selected) || [];
      var text = sel.map(function(o){ return labelForOpt(im.id, o); }).join("; ");
      return { text: text, correctness: isItemCorrect("l3", im, sel) };
    });
  });
  headers.push("Level 3 Score");
  colSpecs.push(function(p){ var s = scoreLevel3(p, categoryFilter); return { text: formatScore(s), isScore:true, frac: s.total ? s.correct/s.total : null }; });

  headers.push("Total Score");
  colSpecs.push(function(p){
    var s1=scoreLevel1(p, categoryFilter), s2=scoreLevel2(p, categoryFilter), s3=scoreLevel3(p, categoryFilter);
    var correct = s1.correct+s2.correct+s3.correct, total = s1.total+s2.total+s3.total;
    return { text: total ? formatScore({correct:correct, total:total}) : "\u2014", isScore:true, frac: total ? correct/total : null };
  });

  var rows = list.map(function(p){
    return [{text:p.name}, {text:p.id}].concat(colSpecs.map(function(fn){ return fn(p); }));
  });
  return { headers: headers, rows: rows };
}

function toCSV(list, categoryFilter){
  var matrix = buildResultsMatrix(list, categoryFilter);
  var rows = [matrix.headers].concat(matrix.rows.map(function(cells){ return cells.map(function(c){ return c.text; }); }));
  return rows.map(function(r){
    return r.map(function(v){ var s = String(v==null?"":v).replace(/"/g,'""'); return '"'+s+'"'; }).join(",");
  }).join("\n");
}

function scoreCellColor(frac){
  if(frac === null || frac === undefined) return "#ffffff";
  if(frac >= 0.8) return "#d7f2df";
  if(frac >= 0.5) return "#fff4cc";
  return "#fbdad4";
}
// Produces an HTML table saved with an .xls extension \u2014 a well-supported
// trick for getting real cell colors into Excel/Sheets without a binary
// spreadsheet library. It's not a true .xlsx file, just HTML Excel can read.
function matrixToExcelHtml(matrix, title){
  var html = '<html><head><meta charset="utf-8"></head><body>';
  if(title) html += '<h3 style="font-family:sans-serif;">' + escapeHtml(title) + '</h3>';
  html += '<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse; font-family:sans-serif; font-size:13px;">';
  html += '<tr>' + matrix.headers.map(function(h){ return '<th style="background:#e8e8e8; text-align:left; mso-number-format:\'\\@\';">' + escapeHtml(h) + '</th>'; }).join('') + '</tr>';
  matrix.rows.forEach(function(cells){
    html += '<tr>' + cells.map(function(c){
      var bg = c.correctness === true ? "#d7f2df" : c.correctness === false ? "#fbdad4" : (c.isScore ? scoreCellColor(c.frac) : "#ffffff");
      // mso-number-format:'\@' forces Excel to treat the cell as plain text
      // (Google Sheets ignores this hint but no longer needs it \u2014 the
      // fraction-slash character in formatScore() already prevents the
      // date misparse there regardless of format).
      return '<td style="background:' + bg + '; mso-number-format:\'\\@\';">' + escapeHtml(c.text) + '</td>';
    }).join('') + '</tr>';
  });
  html += '</table></body></html>';
  return html;
}
function toColorCodedExcelHtml(list, categoryFilter){
  return matrixToExcelHtml(buildResultsMatrix(list, categoryFilter));
}
// Builds one "compiled" sheet (everyone, everything) plus one sheet per
// method category, each scored and colored using only that category's items.
// Returned as separate files rather than tabs in one file, since a genuine
// multi-sheet spreadsheet format risks inconsistent support in Google Sheets
// \u2014 five separate files in the same proven format is more reliable.
function buildCategoryExportFiles(list){
  var files = [{ name: "compiled", html: matrixToExcelHtml(buildResultsMatrix(list), "Compiled \u2014 all items") }];
  METHOD_CATEGORIES.forEach(function(cat){
    files.push({ name: cat, html: matrixToExcelHtml(buildResultsMatrix(list, cat), cat + " \u2014 items tagged with this category") });
  });
  return files;
}

/* ---------- event handlers ---------- */
function attachHandlers(){
  var app = document.getElementById("app");

  var authSubmit = document.getElementById("authSubmit");
  if(authSubmit) authSubmit.onclick = function(){
    var code = document.getElementById("authInput").value;
    if(!code){ authError = "Please enter " + (authMode==="researcher"?"your password.":"the passcode."); render(); return; }
    trySignIn(authMode==="researcher" ? RESEARCHER_LOGIN_EMAIL : SHARED_LOGIN_EMAIL, code);
  };
  var authInput = document.getElementById("authInput");
  if(authInput) authInput.onkeydown = function(e){ if(e.key === "Enter") authSubmit.click(); };

  var authModeSwitch = document.getElementById("authModeSwitch");
  if(authModeSwitch) authModeSwitch.onclick = function(){
    authMode = authMode === "researcher" ? "participant" : "researcher";
    authError = "";
    render();
  };

  var startBtn = document.getElementById("startBtn");
  if(startBtn) startBtn.onclick = async function(){
    var name = document.getElementById("nameInput").value.trim();
    if(!name){ lastError = "Please enter your name to begin."; render(); return; }
    lastError = "";
    var id = genId();
    participant = newParticipant(name, id);
    draftCache = freshDraftCache();
    await persistCreate(participant);
    try{ localStorage.setItem("survey_last_id", id); }catch(e){}
    screen = "dashboard";
    render();
  };

  var resumeBtn = document.getElementById("resumeBtn");
  if(resumeBtn) resumeBtn.onclick = async function(){
    var idRaw = document.getElementById("resumeInput").value.trim().toUpperCase();
    if(!idRaw){ lastError = "Please enter your participant ID."; render(); return; }
    var p = await fetchParticipant(idRaw);
    if(!p){ lastError = "No survey found for that ID. Double-check it and try again."; render(); return; }
    lastError = "";
    participant = p;
    loadDraftFromParticipant(p);
    try{ localStorage.setItem("survey_last_id", p.id); }catch(e){}
    screen = allDone(p) ? "complete" : "dashboard";
    render();
  };

  var switchParticipant = document.getElementById("switchParticipant");
  if(switchParticipant) switchParticipant.onclick = function(){
    try{ localStorage.removeItem("survey_last_id"); }catch(e){}
    participant = null;
    draftCache = freshDraftCache();
    lastError = "";
    screen = "landing";
    render();
  };

  var reviewAnswersBtn = document.getElementById("reviewAnswersBtn");
  if(reviewAnswersBtn) reviewAnswersBtn.onclick = function(){ screen = "dashboard"; render(); };

  var goToResearcherLogin = document.getElementById("goToResearcherLogin");
  if(goToResearcherLogin) goToResearcherLogin.onclick = async function(){
    authReady = false; participant = null; researcherData = []; contentDraft = null;
    authError = ""; authMode = "researcher";
    try{ await fbAuth.signOut(); }catch(e){}
    screen = "auth"; render();
  };

  var signOutBtn = document.getElementById("signOutBtn");
  if(signOutBtn) signOutBtn.onclick = async function(){
    authReady = false; isResearcherSession = false; participant = null; researcherData = []; contentDraft = null;
    authMode = "participant"; authError = "";
    await fbAuth.signOut();
    screen = "auth"; render();
  };

  var tabResults = document.getElementById("tabResults");
  if(tabResults) tabResults.onclick = function(){ researcherTab = "results"; render(); };
  var tabContent = document.getElementById("tabContent");
  if(tabContent) tabContent.onclick = function(){ researcherTab = "content"; contentDraft = contentDraft || cloneStudy(STUDY); render(); };

  var refreshData = document.getElementById("refreshData");
  if(refreshData) refreshData.onclick = async function(){
    var res = await fetchAllParticipants();
    researcherData = res.data;
    researcherLoadError = res.error;
    render();
    showToast(res.error ? "Couldn't refresh \u2014 see the warning below" : "Refreshed");
  };


  var exportResults = document.getElementById("exportResults");
  if(exportResults) exportResults.onclick = function(){
    var files = buildCategoryExportFiles(researcherData);
    files.forEach(function(f, i){
      setTimeout(function(){
        downloadBlob("survey_results_" + f.name.replace(/[^a-zA-Z0-9_-]/g, "_") + ".xls", f.html, "application/vnd.ms-excel");
      }, i * 350);
    });
    showToast("Downloading " + files.length + " files (compiled + one per category)");
  };

  app.querySelectorAll("[data-view-detail]").forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute("data-view-detail");
      var p = researcherData.filter(function(x){return x.id===id;})[0];
      document.getElementById("detailPane").innerHTML = '<div style="background:var(--panel-2); padding:14px; border-radius:10px; border:1px solid var(--line); max-height:400px; overflow:auto;">' + formatDetail(p) + '</div>';
    };
  });

  app.querySelectorAll("[data-delete-participant]").forEach(function(btn){
    btn.onclick = async function(){
      var id = btn.getAttribute("data-delete-participant");
      var p = researcherData.filter(function(x){return x.id===id;})[0];
      var label = p ? (p.name + " (" + p.id + ")") : id;
      var sure = typeof confirm === "function" ? confirm("Delete " + label + "? This permanently removes their data and cannot be undone.") : true;
      if(!sure) return;
      btn.disabled = true;
      var result = await deleteParticipant(id);
      if(result.ok){
        researcherData = researcherData.filter(function(x){return x.id!==id;});
        document.getElementById("detailPane").innerHTML = "";
        render();
        showToast("Deleted " + label);
      } else {
        btn.disabled = false;
        showToast("Couldn\u2019t delete \u2014 check the browser console");
      }
    };
  });

  app.querySelectorAll("[data-goto]").forEach(function(btn){
    btn.onclick = function(){ activeMatchImage = null; screen = btn.getAttribute("data-goto"); pendingTransition = true; render(); };
  });

  var finishBtn = document.getElementById("finishBtn");
  if(finishBtn) finishBtn.onclick = function(){ screen = "complete"; render(); };

  var backToDash = document.getElementById("backToDash");
  if(backToDash) backToDash.onclick = function(){ activeMatchImage = null; screen = "dashboard"; render(); };

  // Level 1: click an image, then click a description to pair them (within the current set)
  app.querySelectorAll("[data-match-img]").forEach(function(card){
    card.onclick = function(){
      var imgId = card.getAttribute("data-match-img");
      activeMatchImage = (activeMatchImage === imgId) ? null : imgId;
      render();
    };
  });
  app.querySelectorAll("[data-match-desc]").forEach(function(row){
    row.onclick = function(){
      var descId = row.getAttribute("data-match-desc");
      if(!activeMatchImage){ showToast("Select an image first"); return; }
      var si = Math.min(draftCache.level1.currentSet || 0, STUDY.level1.sets.length - 1);
      var setId = STUDY.level1.sets[si].id;
      var setAnswers = draftCache.level1.bySet[setId] || (draftCache.level1.bySet[setId] = {});
      // enforce one description per image, and one image per description
      Object.keys(setAnswers).forEach(function(imgId){
        if(setAnswers[imgId] === descId) delete setAnswers[imgId];
      });
      setAnswers[activeMatchImage] = descId;
      // auto-advance to the next unmatched image within this set, if any
      var setConf = STUDY.level1.sets[si];
      var next = setConf.images.filter(function(im){ return !setAnswers[im.id]; })[0];
      activeMatchImage = next ? next.id : null;
      scheduleAutosave("level1");
      render();
      renderSubmitState("level1");
    };
  });
  var continueMatchSet = document.getElementById("continueMatchSet");
  if(continueMatchSet) continueMatchSet.onclick = function(){
    draftCache.level1.currentSet = Math.min(draftCache.level1.currentSet + 1, STUDY.level1.sets.length - 1);
    activeMatchImage = null;
    scheduleAutosave("level1");
    pendingTransition = true;
    render();
  };
  var prevMatchSet = document.getElementById("prevMatchSet");
  if(prevMatchSet) prevMatchSet.onclick = function(){
    draftCache.level1.currentSet = Math.max(draftCache.level1.currentSet - 1, 0);
    activeMatchImage = null;
    scheduleAutosave("level1");
    pendingTransition = true;
    render();
  };

  // Level 2
  app.querySelectorAll("[data-l2-choice]").forEach(function(btn){
    btn.onclick = function(){
      var imgId = btn.getAttribute("data-l2-choice");
      var value = btn.getAttribute("data-value");
      var cur = draftCache.level2.answers[imgId] || {verdict:"", reasoning:""};
      cur.verdict = value;
      draftCache.level2.answers[imgId] = cur;
      scheduleAutosave("level2");
      render();
    };
  });
  app.querySelectorAll("[data-l2-reason]").forEach(function(ta){
    ta.oninput = function(){
      var imgId = ta.getAttribute("data-l2-reason");
      var cur = draftCache.level2.answers[imgId] || {verdict:"", reasoning:""};
      cur.reasoning = ta.value;
      draftCache.level2.answers[imgId] = cur;
      scheduleAutosave("level2");
      renderSubmitState("level2");
      renderNextButtonState("level2");
    };
  });
  var nextL2 = document.getElementById("nextL2");
  if(nextL2) nextL2.onclick = function(){
    draftCache.level2.currentIndex = Math.min(draftCache.level2.currentIndex + 1, STUDY.level2.images.length - 1);
    scheduleAutosave("level2");
    pendingTransition = true;
    render();
  };
  var prevL2 = document.getElementById("prevL2");
  if(prevL2) prevL2.onclick = function(){
    draftCache.level2.currentIndex = Math.max(draftCache.level2.currentIndex - 1, 0);
    pendingTransition = true;
    render();
  };

  // Level 3
  app.querySelectorAll("[data-l3-opt]").forEach(function(cb){
    cb.onchange = function(){
      var parts = cb.getAttribute("data-l3-opt").split("::");
      var imgId = parts[0], optId = parts[1];
      var cur = draftCache.level3.answers[imgId] || {selected:[]};
      var idx = cur.selected.indexOf(optId);
      if(cb.checked && idx===-1) cur.selected.push(optId);
      if(!cb.checked && idx>-1) cur.selected.splice(idx,1);
      draftCache.level3.answers[imgId] = cur;
      scheduleAutosave("level3");
      renderSubmitState("level3");
      renderNextButtonState("level3");
    };
  });
  var nextL3 = document.getElementById("nextL3");
  if(nextL3) nextL3.onclick = function(){
    draftCache.level3.currentIndex = Math.min(draftCache.level3.currentIndex + 1, STUDY.level3.images.length - 1);
    scheduleAutosave("level3");
    pendingTransition = true;
    render();
  };
  var prevL3 = document.getElementById("prevL3");
  if(prevL3) prevL3.onclick = function(){
    draftCache.level3.currentIndex = Math.max(draftCache.level3.currentIndex - 1, 0);
    pendingTransition = true;
    render();
  };

  var submitLevelBtn = document.getElementById("submitLevelBtn");
  if(submitLevelBtn) submitLevelBtn.onclick = async function(){
    var key = submitLevelBtn.getAttribute("data-level");
    if(!levelIsComplete(key)) return;
    var payload = {};
    payload[key] = { completed:true, submittedAt: Date.now(), draft: draftCache[key] };
    await persistUpdate(participant.id, payload);
    if(backendOk) showToast("Submitted!"); // if it failed, persistUpdate already showed its own warning toast
    if(allDone(participant)){ screen = "complete"; }
    else { screen = "dashboard"; }
    render();
  };

  /* ---------- content editor handlers ---------- */
  if(researcherTab === "content" && contentDraft){
    app.querySelectorAll("[data-category]").forEach(function(sel){
      var key = sel.getAttribute("data-category");
      var m;
      sel.onchange = function(){
        var val = sel.value || null;
        if(m = key.match(/^l1-(\d+)-(\d+)$/)) contentDraft.level1.sets[+m[1]].images[+m[2]].category = val;
        else if(m = key.match(/^l2-(\d+)$/)) contentDraft.level2.images[+m[1]].category = val;
        else if(m = key.match(/^l3-(\d+)$/)) contentDraft.level3.images[+m[1]].category = val;
      };
    });

    app.querySelectorAll("[data-answer-key]").forEach(function(el){
      var key = el.getAttribute("data-answer-key");
      var m;
      if(el.type === "checkbox"){
        el.onchange = function(){
          m = key.match(/^l3-(\d+)-(\d+)$/);
          var im = contentDraft.level3.images[+m[1]];
          var optId = im.options[+m[2]].id;
          if(!im.correctOptions) im.correctOptions = [];
          var idx = im.correctOptions.indexOf(optId);
          if(el.checked && idx===-1) im.correctOptions.push(optId);
          if(!el.checked && idx>-1) im.correctOptions.splice(idx,1);
        };
      } else if(m = key.match(/^l1-(\d+)-(\d+)$/)){
        var si = +m[1], ii = +m[2];
        el.oninput = function(){
          var set = contentDraft.level1.sets[si];
          var im = set.images[ii];
          var raw = el.value.trim();
          var n = parseInt(raw, 10);
          if(raw === ""){
            im.correctDescId = null;
            el.classList.remove("input-error");
          } else if(n >= 1 && n <= set.descriptions.length){
            im.correctDescId = set.descriptions[n-1].id;
            el.classList.remove("input-error");
          } else {
            im.correctDescId = null;
            el.classList.add("input-error");
          }
        };
      } else {
        el.onchange = function(){
          if(m = key.match(/^l2-(\d+)$/)) contentDraft.level2.images[+m[1]].correctVerdict = el.value || null;
        };
      }
    });

    app.querySelectorAll("[data-edit]").forEach(function(inp){
      inp.oninput = function(){
        var key = inp.getAttribute("data-edit");
        var m;
        if(m = key.match(/^l1img-(\d+)-(\d+)$/)) contentDraft.level1.sets[+m[1]].images[+m[2]].id = inp.value;
        else if(m = key.match(/^l1desc-(\d+)-(\d+)$/)) contentDraft.level1.sets[+m[1]].descriptions[+m[2]].text = inp.value;
        else if(m = key.match(/^l2img-id-(\d+)$/)) contentDraft.level2.images[+m[1]].id = inp.value;
        else if(m = key.match(/^l3img-id-(\d+)$/)) contentDraft.level3.images[+m[1]].id = inp.value;
        else if(m = key.match(/^l3opt-(\d+)-(\d+)$/)) contentDraft.level3.images[+m[1]].options[+m[2]].text = inp.value;
      };
    });

    app.querySelectorAll("[data-upload]").forEach(function(inp){
      inp.onchange = async function(){
        var file = inp.files[0];
        if(!file) return;
        var key = inp.getAttribute("data-upload");
        var m;
        showToast("Processing image\u2026");
        try{
          var url = await fileToResizedDataUrl(file);
          if(m = key.match(/^l1img-(\d+)-(\d+)$/)) contentDraft.level1.sets[+m[1]].images[+m[2]].img = url;
          else if(m = key.match(/^l2img-(\d+)$/)) contentDraft.level2.images[+m[1]].img = url;
          else if(m = key.match(/^l3img-(\d+)$/)) contentDraft.level3.images[+m[1]].img = url;
          showToast("Image ready \u2014 click Save Changes to publish");
          render();
        }catch(e){ console.error(e); showToast("Couldn't process that image"); }
      };
    });

    function swapAdjacent(arr, i, dir){
      var j = i + dir;
      if(j < 0 || j >= arr.length) return false;
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      return true;
    }
    function moveByKey(key, dir){
      var m;
      if(m = key.match(/^levelorder-(\d+)$/)) swapAdjacent(contentDraft.levelOrder, +m[1], dir);
      else if(m = key.match(/^l1set-(\d+)$/)) swapAdjacent(contentDraft.level1.sets, +m[1], dir);
      else if(m = key.match(/^l2img-(\d+)$/)) swapAdjacent(contentDraft.level2.images, +m[1], dir);
      else if(m = key.match(/^l3img-(\d+)$/)) swapAdjacent(contentDraft.level3.images, +m[1], dir);
    }
    app.querySelectorAll("[data-move-up]").forEach(function(btn){
      btn.onclick = function(){ moveByKey(btn.getAttribute("data-move-up"), -1); render(); };
    });
    app.querySelectorAll("[data-move-down]").forEach(function(btn){
      btn.onclick = function(){ moveByKey(btn.getAttribute("data-move-down"), 1); render(); };
    });

    app.querySelectorAll("[data-remove]").forEach(function(btn){
      btn.onclick = function(){
        var key = btn.getAttribute("data-remove");
        var m;
        if(m = key.match(/^l1img-(\d+)-(\d+)$/)) contentDraft.level1.sets[+m[1]].images.splice(+m[2],1);
        else if(m = key.match(/^l1desc-(\d+)-(\d+)$/)) contentDraft.level1.sets[+m[1]].descriptions.splice(+m[2],1);
        else if(m = key.match(/^l1set-(\d+)$/)) contentDraft.level1.sets.splice(+m[1],1);
        else if(m = key.match(/^l2img-(\d+)$/)) contentDraft.level2.images.splice(+m[1],1);
        else if(m = key.match(/^l3img-(\d+)$/)) contentDraft.level3.images.splice(+m[1],1);
        else if(m = key.match(/^l3opt-(\d+)-(\d+)$/)){
          var img3 = contentDraft.level3.images[+m[1]];
          var removedOpt = img3.options[+m[2]];
          img3.options.splice(+m[2],1);
          if(removedOpt && img3.correctOptions){
            var coIdx = img3.correctOptions.indexOf(removedOpt.id);
            if(coIdx > -1) img3.correctOptions.splice(coIdx,1);
          }
        }
        render();
      };
    });

    app.querySelectorAll("[data-add]").forEach(function(btn){
      btn.onclick = function(){
        var key = btn.getAttribute("data-add");
        var m;
        if(m = key.match(/^l3opt-(\d+)$/)){
          var n = contentDraft.level3.images[+m[1]].options.length + 1;
          contentDraft.level3.images[+m[1]].options.push({id:"o"+Date.now(), text:"New option " + n});
        } else if(m = key.match(/^l1img-(\d+)$/)){
          contentDraft.level1.sets[+m[1]].images.push({id:"img"+Date.now(), img: placeholderImg('#6b7280','square','New Image'), correctDescId:null, category:null});
        } else if(m = key.match(/^l1desc-(\d+)$/)){
          contentDraft.level1.sets[+m[1]].descriptions.push({id:"d"+Date.now(), text:"New description"});
        }
        render();
      };
    });

    var cleanupImagesBtn = document.getElementById("cleanupImagesBtn");
    if(cleanupImagesBtn) cleanupImagesBtn.onclick = async function(){
      cleanupImagesBtn.disabled = true;
      try{
        var unused = await findUnusedImageIds();
        if(unused.length === 0){
          showToast("No unused images found \u2014 nothing to clean up");
          cleanupImagesBtn.disabled = false;
          return;
        }
        var sure = typeof confirm === "function"
          ? confirm("Delete " + unused.length + " unused image(s) from storage? This can't be undone, but it won't affect any current task \u2014 they're not referenced by anything live.")
          : true;
        if(!sure){ cleanupImagesBtn.disabled = false; return; }
        var result = await deleteImagesByIds(unused);
        if(result.failed.length){
          showToast("Deleted " + result.deleted + ", but " + result.failed.length + " failed \u2014 check console");
          console.error("failed to delete image ids:", result.failed);
        } else {
          showToast("Deleted " + result.deleted + " unused image(s)");
        }
      }catch(e){ console.error(e); showToast("Cleanup failed \u2014 check console"); }
      cleanupImagesBtn.disabled = false;
    };

    var addL1Set = document.getElementById("addL1Set");
    if(addL1Set) addL1Set.onclick = function(){
      var sizeInput = document.getElementById("newSetSize");
      var n = sizeInput ? parseInt(sizeInput.value, 10) : 3;
      if(!n || n < 1) n = 3;
      if(n > 10) n = 10; // keep individual Firestore docs small and the UI usable
      contentDraft.level1.sets.push(buildDefaultMatchSet(Date.now(), n));
      render();
    };
    var addL2Img = document.getElementById("addL2Img");
    if(addL2Img) addL2Img.onclick = function(){
      contentDraft.level2.images.push({id:"img"+Date.now(), type:"image", img: placeholderImg('#6b7280','blob','New Item'), reportText:"", correctVerdict:null, category:null});
      render();
    };
    app.querySelectorAll("[data-l2type]").forEach(function(sel){
      sel.onchange = function(){
        var i = +sel.getAttribute("data-l2type");
        var im = contentDraft.level2.images[i];
        im.type = sel.value;
        if(im.type === "image" && !im.img) im.img = placeholderImg('#6b7280','blob','New Item');
        if(im.type === "text") im.img = ""; // avoid embedding stale image bytes into the content doc
        render();
      };
    });
    app.querySelectorAll("[data-l2text]").forEach(function(ta){
      ta.oninput = function(){
        var i = +ta.getAttribute("data-l2text");
        contentDraft.level2.images[i].reportText = ta.value;
      };
    });
    var addL3Img = document.getElementById("addL3Img");
    if(addL3Img) addL3Img.onclick = function(){
      contentDraft.level3.images.push({id:"img"+Date.now(), img: placeholderImg('#6b7280','triangle','New Image'), correctOptions: [], category:null, options: buildDefaultL3Options()});
      render();
    };

    var saveContentBtn = document.getElementById("saveContentBtn");
    if(saveContentBtn) saveContentBtn.onclick = async function(){
      saveContentBtn.disabled = true;
      try{
        var result = await saveStudyConfig(contentDraft);
        contentDraft = null;
        if(result && result.repaired && result.repaired.length){
          showToast(result.repaired.length + " item ID(s) were blank/duplicate and got auto-fixed \u2014 saved");
        } else {
          showToast("Content saved \u2014 live for everyone now");
        }
        render();
      }catch(e){ console.error(e); showToast("Save failed \u2014 check console"); saveContentBtn.disabled = false; }
    };
    var discardContentBtn = document.getElementById("discardContentBtn");
    if(discardContentBtn) discardContentBtn.onclick = function(){
      contentDraft = cloneStudy(STUDY);
      showToast("Changes discarded");
      render();
    };
  }
}

function renderSubmitState(key){
  var btn = document.getElementById("submitLevelBtn");
  if(btn && btn.getAttribute("data-level")===key){
    btn.disabled = !levelIsComplete(key);
  }
}
function renderNextButtonState(key){
  var id = key === "level2" ? "nextL2" : "nextL3";
  var btn = document.getElementById(id);
  if(!btn) return;
  var conf = STUDY[key];
  var idx = draftCache[key].currentIndex;
  var im = conf.images[idx];
  btn.disabled = !itemIsAnswered(key, im.id);
}


init();
</script>
</body>
</html>
