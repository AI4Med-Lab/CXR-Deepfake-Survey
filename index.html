<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Perception Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F6F5F1;
    --panel:#FFFFFF;
    --panel-2:#EFEDE6;
    --ink:#1B2430;
    --ink-soft:#5B6270;
    --line:#DDD8CC;
    --line-strong:#C6C0B2;
    --accent:#2F4B7C;
    --accent-hover:#1F3559;
    --accent-soft:#E7ECF4;
    --gold:#9C7A2E;
    --gold-soft:#F3ECD8;
    --success:#3F7A5C;
    --success-soft:#E4EFE8;
    --danger:#A6412F;
    --danger-soft:#F5E7E3;
    --radius:6px;
    --radius-lg:8px;
    --serif: "Spectral", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-family: var(--sans);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171C;
      --panel:#1B1F26;
      --panel-2:#20242C;
      --ink:#EDEBE4;
      --ink-soft:#9BA1AC;
      --line:#333944;
      --line-strong:#454C58;
      --accent:#7FA0D6;
      --accent-hover:#9CB6E2;
      --accent-soft:#212A38;
      --gold:#D6B15E;
      --gold-soft:#2B2517;
      --success:#7FB89A;
      --success-soft:#17251E;
      --danger:#E08A78;
      --danger-soft:#2A1A17;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171C; --panel:#1B1F26; --panel-2:#20242C; --ink:#EDEBE4; --ink-soft:#9BA1AC;
    --line:#333944; --line-strong:#454C58; --accent:#7FA0D6; --accent-hover:#9CB6E2;
    --accent-soft:#212A38; --gold:#D6B15E; --gold-soft:#2B2517; --success:#7FB89A;
    --success-soft:#17251E; --danger:#E08A78; --danger-soft:#2A1A17;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{ max-width:800px; margin:0 auto; padding:0 20px 90px; }

  /* ---------- header ---------- */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 2px; flex-wrap:wrap; gap:10px;
    border-bottom:1px solid var(--line); margin-bottom:32px;
  }
  .brand{
    font-family:var(--serif); font-weight:600; font-size:18px; letter-spacing:.005em;
    color:var(--ink);
  }
  .brand .brand-sub{ display:block; font-family:var(--sans); font-weight:500; font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .whoami{
    font-size:13px; color:var(--ink-soft);
    display:flex; align-items:center; gap:8px;
  }
  .whoami b{ color:var(--ink); font-weight:600; }

  /* ---------- surfaces ---------- */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:32px;
    margin-bottom:20px;
  }
  h1{ font-family:var(--serif); font-weight:600; font-size:28px; line-height:1.25; margin:0 0 10px; letter-spacing:.001em; }
  h2{ font-family:var(--serif); font-weight:600; font-size:20px; margin:0 0 6px; }
  p.sub{ color:var(--ink-soft); margin:0 0 22px; line-height:1.55; max-width:62ch; font-size:14.5px; }
  label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink-soft); }

  input[type=text]{
    width:100%; padding:10px 12px; border-radius:var(--radius);
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; margin-bottom:14px;
  }
  input[type=text]:focus, textarea:focus, select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  textarea{
    width:100%; min-height:80px; padding:10px 12px; border-radius:var(--radius);
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink);
    font-size:14px; font-family:var(--sans); resize:vertical;
  }
  select{
    width:100%; padding:9px 11px; border-radius:var(--radius);
    border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); font-size:14px; font-family:var(--sans);
  }

  button{
    font-family:var(--sans); cursor:pointer; border:none; border-radius:var(--radius);
    font-size:14px; font-weight:600; padding:10px 18px;
    transition:background .15s ease, opacity .15s ease, border-color .15s ease;
  }
  button:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-secondary{ background:var(--panel); color:var(--ink); border:1px solid var(--line-strong); }
  .btn-secondary:hover{ background:var(--panel-2); }
  .btn-text{ background:transparent; color:var(--accent); padding:8px 4px; }
  .link-small{ font-size:12.5px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; }
  .link-small:hover{ color:var(--ink); }

  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row.between{ justify-content:space-between; }
  hr.sep{ border:none; border-top:1px solid var(--line); margin:26px 0; }

  .id-box{
    border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:0 var(--radius) var(--radius) 0; background:var(--accent-soft);
    padding:14px 16px; font-size:13.5px; margin-bottom:22px; color:var(--ink-soft);
  }
  .id-box code{ font-family:var(--sans); font-size:15px; font-weight:700; color:var(--accent); letter-spacing:.03em; }

  /* ---------- progress rail (dashboard) ---------- */
  .progress-rail{ display:flex; align-items:center; gap:0; margin-bottom:28px; }
  .progress-rail .seg{ flex:1; height:4px; background:var(--line); }
  .progress-rail .seg.done{ background:var(--accent); }
  .progress-rail .seg:not(:last-child){ margin-right:4px; }

  .level-list{ display:flex; flex-direction:column; }
  .level-item{
    display:flex; align-items:center; gap:16px;
    padding:20px 4px; border-bottom:1px solid var(--line);
  }
  .level-item:last-child{ border-bottom:none; }
  .level-num{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    border:1.5px solid var(--line-strong); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:600; font-size:15px;
  }
  .level-num.done{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .level-info{ flex:1; min-width:0; }
  .level-info .t{ font-weight:600; font-size:15px; }
  .level-info .s{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }

  .badge{ font-size:11.5px; font-weight:600; padding:4px 10px; border-radius:999px; }
  .badge.done{ background:var(--success-soft); color:var(--success); }
  .badge.progress{ background:var(--gold-soft); color:var(--gold); }
  .badge.todo{ background:var(--panel-2); color:var(--ink-soft); }

  /* ---------- task blocks (levels 2 & 3) ---------- */
  .task-block{
    border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:20px; margin-bottom:18px; background:var(--paper);
  }
  .task-block img{
    width:100%; max-width:280px; border-radius:var(--radius);
    display:block; margin-bottom:14px; border:1px solid var(--line);
  }
  .choice-row{ display:flex; gap:10px; margin-bottom:14px; }
  .choice-btn{
    flex:1; padding:11px; border-radius:var(--radius); border:1.5px solid var(--line-strong);
    background:var(--panel); color:var(--ink); font-weight:600; text-align:center; font-family:var(--sans);
  }
  .choice-btn.selected-real{ border-color:var(--success); background:var(--success-soft); color:var(--success); }
  .choice-btn.selected-fake{ border-color:var(--danger); background:var(--danger-soft); color:var(--danger); }

  .checkbox-list{ display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .checkbox-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--panel);
    font-size:14px; cursor:pointer;
  }
  .checkbox-item input{ width:16px; height:16px; accent-color:var(--accent); flex-shrink:0; }

  /* ---------- level 1: two-column matching ---------- */
  .match-grid{ display:grid; grid-template-columns:1fr 1fr; gap:28px; align-items:start; }
  .match-col-label{ font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:12px; text-transform:none; }
  .match-images{ display:flex; flex-direction:column; gap:14px; }
  .match-image-card{
    border:1.5px solid var(--line); border-radius:var(--radius-lg); background:var(--paper);
    padding:14px; cursor:pointer; transition:border-color .15s ease, background .15s ease;
    display:flex; gap:12px; align-items:center;
  }
  .match-image-card:hover{ border-color:var(--line-strong); }
  .match-image-card.active{ border-color:var(--accent); background:var(--accent-soft); }
  .match-image-card img{ width:76px; height:76px; object-fit:cover; border-radius:6px; border:1px solid var(--line); flex-shrink:0; }
  .match-image-card .info{ flex:1; min-width:0; }
  .match-image-card .assign-note{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
  .match-image-card .assign-note.matched{ color:var(--ink); }
  .match-badge{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:13.5px; color:#fff;
  }
  .match-descs{ display:flex; flex-direction:column; gap:14px; }
  .match-desc-row{
    border:1.5px solid var(--line); border-radius:var(--radius-lg); background:var(--panel);
    padding:14px; cursor:pointer; display:flex; gap:12px; align-items:flex-start;
    transition:border-color .15s ease, background .15s ease; font-size:13.5px; line-height:1.5;
  }
  .match-desc-row:hover{ border-color:var(--line-strong); }
  .match-desc-row.awaiting{ border-style:dashed; }
  .match-slot{
    width:28px; height:28px; border-radius:50%; flex-shrink:0; margin-top:1px;
    border:1.5px dashed var(--line-strong); display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-weight:700; font-size:13.5px; color:var(--ink-soft);
  }
  .match-hint{
    font-size:12.5px; color:var(--ink-soft); background:var(--panel-2);
    border-radius:var(--radius); padding:9px 12px; margin-bottom:18px;
  }
  @media (max-width:640px){
    .match-grid{ grid-template-columns:1fr; gap:20px; }
  }

  .footer-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.18); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  table.results{ width:100%; border-collapse:collapse; font-size:13px; }
  table.results th, table.results td{ text-align:left; padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.results th{ color:var(--ink-soft); font-weight:600; font-size:12px; }
  .pill{ display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.done{ background:var(--success-soft); color:var(--success); }
  .pill.todo{ background:var(--panel-2); color:var(--ink-soft); }
  .warn-banner{
    background:var(--danger-soft); color:var(--danger); padding:11px 14px;
    border-radius:var(--radius); font-size:13px; margin-bottom:16px; border:1px solid transparent;
  }
  ::placeholder{ color:var(--ink-soft); opacity:.6; }
  @media (max-width:480px){
    .card{ padding:22px; }
    h1{ font-size:23px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   STUDY CONTENT CONFIG
   Replace the placeholder images (currently generated SVGs) with your real
   study stimuli. Easiest path: convert each real image to a base64 data URI
   and paste it as the `img` value below, e.g. "data:image/png;base64,...."
   ========================================================================= */
function placeholderImg(bg, shape, label){
  var shapes = {
    circle: '<circle cx="150" cy="115" r="78" fill="#fff" opacity="0.92"/>',
    square: '<rect x="72" y="38" width="156" height="156" fill="#fff" opacity="0.92"/>',
    triangle: '<polygon points="150,28 248,188 52,188" fill="#fff" opacity="0.92"/>',
    blob: '<path d="M90 60 C140 20 220 40 230 100 C240 160 190 200 130 190 C70 180 40 100 90 60 Z" fill="#fff" opacity="0.92"/>'
  };
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">' +
    '<rect width="320" height="220" fill="' + bg + '"/>' + (shapes[shape]||'') +
    '<text x="160" y="206" font-size="13" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="600">' + label + '</text></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

var DEFAULT_STUDY = {
  level1: {
    title: "Level 1 \u2014 Match the Images",
    instructions: "Look at each image below and select the description that matches it best.",
    images: [
      { id: "m1", img: placeholderImg('#4f46e5','circle','Image A') },
      { id: "m2", img: placeholderImg('#ea580c','square','Image B') },
      { id: "m3", img: placeholderImg('#059669','triangle','Image C') }
    ],
    descriptions: [
      { id: "d1", text: "A round, continuous form often associated with unity and wholeness." },
      { id: "d2", text: "A four-sided form often associated with stability and structure." },
      { id: "d3", text: "A three-sided form often associated with direction and hierarchy." }
    ]
  },
  level2: {
    title: "Level 2 \u2014 Real or Fake?",
    instructions: "For each image, decide whether you believe it is real or AI-generated/fake, then briefly explain your reasoning.",
    images: [
      { id: "r1", img: placeholderImg('#0369a1','blob','Sample 1') },
      { id: "r2", img: placeholderImg('#be185d','blob','Sample 2') },
      { id: "r3", img: placeholderImg('#7c3aed','blob','Sample 3') }
    ]
  },
  level3: {
    title: "Level 3 \u2014 Select the Most Relevant Option(s)",
    instructions: "For each image, check all options that you think are relevant.",
    images: [
      { id: "c1", img: placeholderImg('#b45309','square','Item 1'), options: [
          {id:'o1', text:'Unnatural lighting or shadows'},
          {id:'o2', text:'Distorted proportions'},
          {id:'o3', text:'Inconsistent background details'},
          {id:'o4', text:'Looks completely natural'} ] },
      { id: "c2", img: placeholderImg('#0d9488','circle','Item 2'), options: [
          {id:'o1', text:'Unnatural lighting or shadows'},
          {id:'o2', text:'Distorted proportions'},
          {id:'o3', text:'Inconsistent background details'},
          {id:'o4', text:'Looks completely natural'} ] },
      { id: "c3", img: placeholderImg('#dc2626','triangle','Item 3'), options: [
          {id:'o1', text:'Unnatural lighting or shadows'},
          {id:'o2', text:'Distorted proportions'},
          {id:'o3', text:'Inconsistent background details'},
          {id:'o4', text:'Looks completely natural'} ] }
    ]
  }
};

function cloneStudy(s){ return JSON.parse(JSON.stringify(s)); }
var STUDY = cloneStudy(DEFAULT_STUDY); // overwritten by loadStudyConfig() once Firestore responds

/* =========================================================================
   FIREBASE CONFIG \u2014 paste the config object from your Firebase project
   (Project settings > Your apps > SDK setup and configuration) here.
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDMN9jtxEEqLnMblHRWVMjq94EUp2ncV1k",
  authDomain: "cxr-deepfake-survey.firebaseapp.com",
  projectId: "cxr-deepfake-survey",
  storageBucket: "cxr-deepfake-survey.firebasestorage.app",
  messagingSenderId: "872922076064",
  appId: "1:872922076064:web:987f3e49710ef3f9de0ac5",
  measurementId: "G-VQJXLC4NKS"
};


// The shared participant login (its PASSWORD is the passcode participants type in).
var SHARED_LOGIN_EMAIL = "participant@deepfake.study.org";
// Your own private researcher login (a real account only you know the password to).
var RESEARCHER_LOGIN_EMAIL = "researcher@deepfake.study.org";

/* ========================================================================= */

firebase.initializeApp(firebaseConfig);
var fbAuth = firebase.auth();
var fbDb = firebase.firestore();
var authReady = false;
var authError = "";
var authMode = "participant"; // "participant" | "researcher"
var isResearcherSession = false;
var participant = null;   // {id, name, createdAt, updatedAt, level1, level2, level3}
var screen = "loading";   // loading | landing | dashboard | level1 | level2 | level3 | complete | researcher
var draftCache = {level1:{}, level2:{}, level3:{}};
var saveTimers = {};
var lastError = "";

function emptyLevelState(){
  return { completed:false, submittedAt:null, draft:{} };
}
function newParticipant(name, id){
  var now = Date.now();
  return { id:id, name:name, createdAt:now, updatedAt:now,
    level1: emptyLevelState(), level2: emptyLevelState(), level3: emptyLevelState() };
}
function genId(){
  var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var s = "";
  for(var i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return "P-" + s;
}

/* ---------- storage layer: Firestore with localStorage fallback for offline resilience ---------- */
function localKey(id){ return "survey_participant_" + id; }

function localSave(p){
  try{ localStorage.setItem(localKey(p.id), JSON.stringify(p)); }catch(e){}
}
function localLoad(id){
  try{
    var raw = localStorage.getItem(localKey(id));
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function withAccessCode(obj){
  // Firestore rules check request.auth, not this field, but we keep it
  // on every doc for easy manual inspection in the Firebase console.
  return Object.assign({}, obj, { _study: "survey-portal" });
}
async function persistCreate(p){
  localSave(p);
  try{ await fbDb.collection("participants").doc(p.id).set(withAccessCode(p)); }
  catch(e){ console.error("firestore set failed", e); }
}
async function persistUpdate(id, partial){
  var current = participant;
  if(current){
    Object.keys(partial).forEach(function(k){
      if(typeof partial[k] === 'object' && !Array.isArray(partial[k]) && current[k]){
        current[k] = Object.assign({}, current[k], partial[k]);
      } else {
        current[k] = partial[k];
      }
    });
    current.updatedAt = Date.now();
    localSave(current);
  }
  try{ await fbDb.collection("participants").doc(id).set(Object.assign({}, partial, {updatedAt: Date.now()}), {merge:true}); }
  catch(e){ console.error("firestore update failed", e); }
}
async function fetchParticipant(id){
  try{
    var snap = await fbDb.collection("participants").doc(id).get();
    if(snap.exists){ return snap.data(); }
  }catch(e){ console.error("firestore get failed", e); }
  return localLoad(id);
}
async function fetchAllParticipants(){
  try{
    var qs = await fbDb.collection("participants").limit(500).get();
    var out = [];
    qs.forEach(function(d){ out.push(d.data()); });
    return out;
  }catch(e){ console.error("firestore list failed", e); return null; }
}

/* ---------- survey content: stored in Firestore, editable by the researcher ---------- */
function allImageIds(study){
  return study.level1.images.map(function(im){return im.id;})
    .concat(study.level2.images.map(function(im){return im.id;}))
    .concat(study.level3.images.map(function(im){return im.id;}));
}

async function loadStudyConfig(){
  try{
    var snap = await fbDb.collection("studyConfig").doc("content").get();
    if(!snap.exists || !snap.data() || !snap.data().study) return;
    var study = snap.data().study;

    // Images are stored separately (one small doc each) to stay well under
    // Firestore's 1 MiB per-document limit even with several photos.
    var qs = await fbDb.collection("studyImages").get();
    var imgMap = {};
    qs.forEach(function(d){ imgMap[d.id] = d.data().dataUrl; });

    [study.level1, study.level2, study.level3].forEach(function(level){
      level.images.forEach(function(im){
        if(imgMap[im.id]) im.img = imgMap[im.id];
      });
    });
    STUDY = study;
  }catch(e){ console.error("failed to load study config", e); }
}

async function saveStudyConfig(newStudy){
  // Split each image out into its own studyImages/{id} document, and keep
  // the main content doc small (just structure + text, no image bytes).
  var contentOnly = cloneStudy(newStudy);
  var writes = [];
  [contentOnly.level1, contentOnly.level2, contentOnly.level3].forEach(function(level, li){
    var full = [newStudy.level1, newStudy.level2, newStudy.level3][li];
    level.images.forEach(function(im, i){
      var dataUrl = full.images[i].img;
      writes.push(fbDb.collection("studyImages").doc(im.id).set({ dataUrl: dataUrl, updatedAt: Date.now() }));
      im.img = ""; // stripped from the content doc itself
    });
  });
  writes.push(fbDb.collection("studyConfig").doc("content").set({ study: contentOnly, updatedAt: Date.now() }));
  await Promise.all(writes);
  STUDY = newStudy;
}

/** Resize + compress an uploaded image entirely in the browser (no backend
 *  storage needed), returning a data URL small enough for a Firestore doc. */
function fileToResizedDataUrl(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.72;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error("read failed")); };
    reader.onload = function(e){
      var img = new Image();
      img.onerror = function(){ reject(new Error("decode failed")); };
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var cw = Math.max(1, Math.round(img.width * scale));
        var ch = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        canvas.getContext("2d").drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function scheduleAutosave(levelKey){
  clearTimeout(saveTimers[levelKey]);
  saveTimers[levelKey] = setTimeout(function(){
    var payload = {};
    payload[levelKey] = { draft: draftCache[levelKey] };
    persistUpdate(participant.id, payload);
    showToast("Progress saved");
  }, 600);
}

function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}

/* ---------- init ---------- */
async function afterAuth(){
  authReady = true;
  var email = fbAuth.currentUser ? fbAuth.currentUser.email : "";
  isResearcherSession = (email === RESEARCHER_LOGIN_EMAIL);
  await loadStudyConfig();

  if(isResearcherSession){
    researcherData = (await fetchAllParticipants()) || [];
    researcherTab = "results";
    screen = "researcher-panel";
    render();
    return;
  }

  var savedId = null;
  try{ savedId = localStorage.getItem("survey_last_id"); }catch(e){}
  if(savedId){
    var p = await fetchParticipant(savedId);
    if(p){ participant = p; draftCache.level1 = p.level1.draft||{}; draftCache.level2 = p.level2.draft||{}; draftCache.level3 = p.level3.draft||{}; screen = allDone(p) ? "complete" : "dashboard"; render(); return; }
  }
  screen = "landing";
  render();
}

async function init(){
  screen = "loading";
  render();
  fbAuth.onAuthStateChanged(function(user){
    if(user && !authReady){ afterAuth(); }
    else if(!user && !authReady){ screen = "auth"; render(); }
  });
}

async function trySignIn(email, password){
  authError = "";
  try{
    await fbAuth.signInWithEmailAndPassword(email, password);
    // onAuthStateChanged fires afterAuth()
  }catch(e){
    authError = (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential" || e.code === "auth/invalid-login-credentials")
      ? "Incorrect passcode. Please check it and try again."
      : "Couldn't sign in (" + e.code + "). Check the Firebase config in the file.";
    render();
  }
}

function allDone(p){
  return p.level1.completed && p.level2.completed && p.level3.completed;
}

function el(html){

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function render(){
  var app = document.getElementById("app");
  var html = "";
  if(screen === "loading"){
    html = '<div class="card"><p class="sub">Loading survey\u2026</p></div>';
  } else if(screen === "auth"){
    html = renderAuthGate();
  } else if(screen === "landing"){

    html = topbar() + renderDashboard();
  } else if(screen === "level1" || screen === "level2" || screen === "level3"){

  attachHandlers();
}

function levelStatus(p, key){
  if(p[key].completed) return "done";
  var d = p[key].draft;
  if(d && Object.keys(d).length>0) return "progress";
  return "todo";
}
function statusLabel(s){ return s==="done"?"Completed":s==="progress"?"In progress":"Not started"; }

function renderDashboard(){
  var p = participant;
  var levels = [
    {key:'level1', title: STUDY.level1.title, desc: 'Match images to descriptions'},

    {key:'level3', title: STUDY.level3.title, desc: 'Select relevant option(s) per image'}

  var items = levels.map(function(l, i){
    var st = levelStatus(p, l.key);
    return '<div class="level-item">' +

}

function renderLevel(key){
  var conf = STUDY[key];

function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

var MATCH_COLORS = ['#2F4B7C','#9C7A2E','#3F7A5C','#7A3F6E','#3F6E7A','#7A5C3F'];
function matchColor(i){ return MATCH_COLORS[i % MATCH_COLORS.length]; }
var activeMatchImage = null; // id of the image currently selected for pairing

function renderLevel1Body(){
  var conf = STUDY.level1;
  var draft = draftCache.level1;
  var imgIndex = {}; conf.images.forEach(function(im,i){ imgIndex[im.id]=i; });

  var reverseMap = {}; // descId -> imgId
  Object.keys(draft).forEach(function(imgId){ if(draft[imgId]) reverseMap[draft[imgId]] = imgId; });

  var matchedCount = conf.images.filter(function(im){ return draft[im.id]; }).length;

  var leftCol = conf.images.map(function(im, i){
    var isActive = activeMatchImage === im.id;
    var matchedDesc = draft[im.id] ? conf.descriptions.filter(function(d){return d.id===draft[im.id];})[0] : null;
    return '<div class="match-image-card' + (isActive?' active':'') + '" data-match-img="' + im.id + '">' +
      '<img src="' + im.img + '" alt="stimulus image" />' +
      '<div class="info">' +
        '<div class="assign-note' + (matchedDesc?' matched':'') + '">' + (matchedDesc ? 'Matched to: \u201c' + escapeHtml(truncate(matchedDesc.text, 40)) + '\u201d' : (isActive ? 'Select a description on the right' : 'Tap to match')) + '</div>' +
      '</div>' +
      '<div class="match-badge" style="background:' + (matchedDesc ? matchColor(i) : (isActive ? '#8A8F98' : '#C6C0B2')) + ';">' + (i+1) + '</div>' +
    '</div>';
  }).join("");

  var rightCol = conf.descriptions.map(function(d){
    var pairedImgId = reverseMap[d.id];
    var pairedIdx = pairedImgId ? imgIndex[pairedImgId] : -1;
    return '<div class="match-desc-row' + (!pairedImgId ? ' awaiting' : '') + '" data-match-desc="' + d.id + '">' +
      '<div class="match-slot"' + (pairedImgId ? ' style="border-style:solid; border-color:' + matchColor(pairedIdx) + '; background:' + matchColor(pairedIdx) + '; color:#fff;"' : '') + '>' + (pairedImgId ? (pairedIdx+1) : '') + '</div>' +
      '<div>' + escapeHtml(d.text) + '</div>' +
    '</div>';
  }).join("");

  return '<div class="match-hint">' + (matchedCount < conf.images.length ? 'Click an image, then click the description you think matches it.' : 'All images matched \u2014 click any pair to change it.') + '</div>' +
  '<div class="match-grid">' +
    '<div><div class="match-col-label">Images</div><div class="match-images">' + leftCol + '</div></div>' +
    '<div><div class="match-col-label">Descriptions</div><div class="match-descs">' + rightCol + '</div></div>' +
  '</div>';
}
function truncate(s, n){ return s.length > n ? s.slice(0,n-1) + '\u2026' : s; }

function renderLevel2Body(){
  var conf = STUDY.level2;
  var draft = draftCache.level2;
  return conf.images.map(function(im){
    var cur = draft[im.id] || {verdict:"", reasoning:""};
    return '<div class="task-block">' +
      '<img src="' + im.img + '" alt="stimulus image" />' +
      '<label>Is this image real or fake?</label>' +
      '<div class="choice-row">' +
        '<button type="button" class="choice-btn ' + (cur.verdict==='real'?'selected-real':'') + '" data-l2-choice="' + im.id + '" data-value="real">Real</button>' +
        '<button type="button" class="choice-btn ' + (cur.verdict==='fake'?'selected-fake':'') + '" data-l2-choice="' + im.id + '" data-value="fake">Fake</button>' +
      '</div>' +
      '<label>Why do you think so?</label>' +
      '<textarea placeholder="Briefly explain your reasoning\u2026" data-l2-reason="' + im.id + '">' + escapeHtml(cur.reasoning||"") + '</textarea>' +
    '</div>';
  }).join("");
}

function renderLevel3Body(){
  var conf = STUDY.level3;
  var draft = draftCache.level3;
  return conf.images.map(function(im){
    var selected = (draft[im.id] && draft[im.id].selected) || [];
    var opts = im.options.map(function(o){
      var checked = selected.indexOf(o.id) > -1;
      return '<label class="checkbox-item"><input type="checkbox" data-l3-opt="' + im.id + '::' + o.id + '" ' + (checked?'checked':'') + '/> ' + escapeHtml(o.text) + '</label>';
    }).join("");
    return '<div class="task-block">' +
      '<img src="' + im.img + '" alt="stimulus image" />' +
      '<label>Select all relevant option(s)</label>' +
      '<div class="checkbox-list">' + opts + '</div>' +
    '</div>';
  }).join("");
}

function levelIsComplete(key){
  var conf = STUDY[key];
  var draft = draftCache[key];
  if(key === "level1"){
    return conf.images.every(function(im){ return draft[im.id]; });
  }
  if(key === "level2"){
    return conf.images.every(function(im){
      var d = draft[im.id];
      return d && d.verdict && d.reasoning && d.reasoning.trim().length >= 3;
    });
  }
  if(key === "level3"){
    return conf.images.every(function(im){
      var d = draft[im.id];
      return d && d.selected && d.selected.length > 0;
    });
  }
  return false;
}

function labelForOpt(imgId, optId){

  if(!im) return optId;
  var o = im.options.filter(function(x){return x.id===optId;})[0];
  return o ? o.text : optId;
}
function formatDetail(p){
  var out = '<div style="font-size:13px; line-height:1.6;">';
  out += '<div style="margin-bottom:10px;"><b>' + escapeHtml(p.name) + '</b> &middot; ' + p.id +
    '<br/><span style="color:var(--ink-soft);">Started ' + new Date(p.createdAt).toLocaleString() + '</span></div>';

  out += '<div style="margin-bottom:12px;"><b>Level 1 \u2014 Matching</b>' + (p.level1.completed ? ' <span class="pill done">Done</span>' : ' <span class="pill todo">Pending</span>') + '<br/>';
  var d1 = p.level1.draft || {};
  STUDY.level1.images.forEach(function(im, i){
    out += (i+1) + '. Image ' + im.id + ' \u2192 ' + (d1[im.id] ? escapeHtml(labelForDesc(d1[im.id])) : '<i style="color:var(--ink-soft);">no answer</i>') + '<br/>';
  });
  out += '</div>';

  out += '<div style="margin-bottom:12px;"><b>Level 2 \u2014 Real/Fake</b>' + (p.level2.completed ? ' <span class="pill done">Done</span>' : ' <span class="pill todo">Pending</span>') + '<br/>';
  var d2 = p.level2.draft || {};
  STUDY.level2.images.forEach(function(im, i){
    var a = d2[im.id];
    out += (i+1) + '. Image ' + im.id + ' \u2192 ' + (a && a.verdict ? '<b>' + a.verdict.toUpperCase() + '</b>: ' + escapeHtml(a.reasoning||'') : '<i style="color:var(--ink-soft);">no answer</i>') + '<br/>';
  });
  out += '</div>';

  out += '<div><b>Level 3 \u2014 Options</b>' + (p.level3.completed ? ' <span class="pill done">Done</span>' : ' <span class="pill todo">Pending</span>') + '<br/>';
  var d3 = p.level3.draft || {};
  STUDY.level3.images.forEach(function(im, i){
    var a = d3[im.id];
    var sels = (a && a.selected && a.selected.length) ? a.selected.map(function(o){return labelForOpt(im.id,o);}).join(", ") : '<i style="color:var(--ink-soft);">no answer</i>';
    out += (i+1) + '. Image ' + im.id + ' \u2192 ' + escapeHtml(sels).replace(/&lt;i style=&quot;color:var\(--ink-soft\);&quot;&gt;/g,'<i style="color:var(--ink-soft);">').replace(/&lt;\/i&gt;/g,'</i>') + '<br/>';
  });
  out += '</div></div>';
  return out;
}

function downloadBlob(filename, content, mime){
  var blob = new Blob([content], {type: mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function toCSV(list){
  var rows = [["name","id","created_at","level1_completed","level1_answers","level2_completed","level2_answers","level3_completed","level3_answers"]];
  list.forEach(function(p){
    rows.push([
      p.name, p.id, new Date(p.createdAt).toISOString(),
      p.level1.completed, JSON.stringify(p.level1.draft||{}),
      p.level2.completed, JSON.stringify(p.level2.draft||{}),
      p.level3.completed, JSON.stringify(p.level3.draft||{})
    ]);
  });
  return rows.map(function(r){
    return r.map(function(v){ var s=String(v).replace(/"/g,'""'); return '"'+s+'"'; }).join(",");
  }).join("\n");
}

/* ---------- event handlers ---------- */
function attachHandlers(){
  var app = document.getElementById("app");

  var authSubmit = document.getElementById("authSubmit");
  if(authSubmit) authSubmit.onclick = function(){
    var code = document.getElementById("authInput").value;
    if(!code){ authError = "Please enter " + (authMode==="researcher"?"your password.":"the passcode."); render(); return; }
    trySignIn(authMode==="researcher" ? RESEARCHER_LOGIN_EMAIL : SHARED_LOGIN_EMAIL, code);
  };
  var authInput = document.getElementById("authInput");
  if(authInput) authInput.onkeydown = function(e){ if(e.key === "Enter") authSubmit.click(); };

  var authModeSwitch = document.getElementById("authModeSwitch");
  if(authModeSwitch) authModeSwitch.onclick = function(){
    authMode = authMode === "researcher" ? "participant" : "researcher";
    authError = "";
    render();
  };

  var startBtn = document.getElementById("startBtn");
  if(startBtn) startBtn.onclick = async function(){
    var name = document.getElementById("nameInput").value.trim();
    if(!name){ lastError = "Please enter your name to begin."; render(); return; }
    lastError = "";
    var id = genId();
    participant = newParticipant(name, id);
    draftCache = {level1:{}, level2:{}, level3:{}};
    await persistCreate(participant);
    try{ localStorage.setItem("survey_last_id", id); }catch(e){}
    screen = "dashboard";
    render();
  };

  var resumeBtn = document.getElementById("resumeBtn");
  if(resumeBtn) resumeBtn.onclick = async function(){
    var idRaw = document.getElementById("resumeInput").value.trim().toUpperCase();
    if(!idRaw){ lastError = "Please enter your participant ID."; render(); return; }
    var p = await fetchParticipant(idRaw);
    if(!p){ lastError = "No survey found for that ID. Double-check it and try again."; render(); return; }
    lastError = "";
    participant = p;
    draftCache.level1 = p.level1.draft || {};
    draftCache.level2 = p.level2.draft || {};
    draftCache.level3 = p.level3.draft || {};
    try{ localStorage.setItem("survey_last_id", p.id); }catch(e){}
    screen = allDone(p) ? "complete" : "dashboard";
    render();
  };

  var switchParticipant = document.getElementById("switchParticipant");
  if(switchParticipant) switchParticipant.onclick = function(){
    try{ localStorage.removeItem("survey_last_id"); }catch(e){}
    participant = null;
    draftCache = {level1:{}, level2:{}, level3:{}};
    lastError = "";
    screen = "landing";
    render();
  };

  var reviewAnswersBtn = document.getElementById("reviewAnswersBtn");
  if(reviewAnswersBtn) reviewAnswersBtn.onclick = function(){ screen = "dashboard"; render(); };

  var goToResearcherLogin = document.getElementById("goToResearcherLogin");
  if(goToResearcherLogin) goToResearcherLogin.onclick = async function(){
    authReady = false; participant = null; researcherData = []; contentDraft = null;
    authError = ""; authMode = "researcher";
    try{ await fbAuth.signOut(); }catch(e){}
    screen = "auth"; render();
  };

  var signOutBtn = document.getElementById("signOutBtn");
  if(signOutBtn) signOutBtn.onclick = async function(){
    authReady = false; isResearcherSession = false; participant = null; researcherData = []; contentDraft = null;
    authMode = "participant"; authError = "";
    await fbAuth.signOut();
    screen = "auth"; render();
  };

  var tabResults = document.getElementById("tabResults");
  if(tabResults) tabResults.onclick = function(){ researcherTab = "results"; render(); };
  var tabContent = document.getElementById("tabContent");
  if(tabContent) tabContent.onclick = function(){ researcherTab = "content"; contentDraft = contentDraft || cloneStudy(STUDY); render(); };

  var refreshData = document.getElementById("refreshData");
  if(refreshData) refreshData.onclick = async function(){
    researcherData = (await fetchAllParticipants()) || [];
    render();
    showToast("Refreshed");
  };


  var exportJson = document.getElementById("exportJson");
  if(exportJson) exportJson.onclick = function(){
    downloadBlob("survey_results.json", JSON.stringify(researcherData, null, 2), "application/json");
    showToast("Download started");
  };

  var exportCsv = document.getElementById("exportCsv");
  if(exportCsv) exportCsv.onclick = function(){
    downloadBlob("survey_results.csv", toCSV(researcherData), "text/csv");
    showToast("Download started");
  };

  app.querySelectorAll("[data-view-detail]").forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute("data-view-detail");
      var p = researcherData.filter(function(x){return x.id===id;})[0];
      document.getElementById("detailPane").innerHTML = '<div style="background:var(--surface-2); padding:14px; border-radius:10px; border:1px solid var(--border); max-height:400px; overflow:auto;">' + formatDetail(p) + '</div>';
    };
  });

  app.querySelectorAll("[data-goto]").forEach(function(btn){
    btn.onclick = function(){ activeMatchImage = null; screen = btn.getAttribute("data-goto"); render(); };
  });

  var finishBtn = document.getElementById("finishBtn");
  if(finishBtn) finishBtn.onclick = function(){ screen = "complete"; render(); };

  var backToDash = document.getElementById("backToDash");
  if(backToDash) backToDash.onclick = function(){ activeMatchImage = null; screen = "dashboard"; render(); };

  // Level 1: click an image, then click a description to pair them
  app.querySelectorAll("[data-match-img]").forEach(function(card){
    card.onclick = function(){
      var imgId = card.getAttribute("data-match-img");
      activeMatchImage = (activeMatchImage === imgId) ? null : imgId;
      render();
    };
  });
  app.querySelectorAll("[data-match-desc]").forEach(function(row){
    row.onclick = function(){
      var descId = row.getAttribute("data-match-desc");
      if(!activeMatchImage){ showToast("Select an image first"); return; }
      // enforce one description per image, and one image per description
      Object.keys(draftCache.level1).forEach(function(imgId){
        if(draftCache.level1[imgId] === descId) delete draftCache.level1[imgId];
      });
      draftCache.level1[activeMatchImage] = descId;
      // auto-advance to the next unmatched image, if any
      var conf = STUDY.level1;
      var next = conf.images.filter(function(im){ return !draftCache.level1[im.id]; })[0];
      activeMatchImage = next ? next.id : null;
      scheduleAutosave("level1");
      render();
      renderSubmitState("level1");
    };
  });

  // Level 2
  app.querySelectorAll("[data-l2-choice]").forEach(function(btn){
    btn.onclick = function(){
      var imgId = btn.getAttribute("data-l2-choice");
      var value = btn.getAttribute("data-value");
      var cur = draftCache.level2[imgId] || {verdict:"", reasoning:""};
      cur.verdict = value;
      draftCache.level2[imgId] = cur;
      scheduleAutosave("level2");
      render();
    };
  });
  app.querySelectorAll("[data-l2-reason]").forEach(function(ta){
    ta.oninput = function(){
      var imgId = ta.getAttribute("data-l2-reason");
      var cur = draftCache.level2[imgId] || {verdict:"", reasoning:""};
      cur.reasoning = ta.value;
      draftCache.level2[imgId] = cur;
      scheduleAutosave("level2");
      renderSubmitState("level2");
    };
  });

  // Level 3
  app.querySelectorAll("[data-l3-opt]").forEach(function(cb){
    cb.onchange = function(){
      var parts = cb.getAttribute("data-l3-opt").split("::");
      var imgId = parts[0], optId = parts[1];
      var cur = draftCache.level3[imgId] || {selected:[]};
      var idx = cur.selected.indexOf(optId);
      if(cb.checked && idx===-1) cur.selected.push(optId);
      if(!cb.checked && idx>-1) cur.selected.splice(idx,1);
      draftCache.level3[imgId] = cur;
      scheduleAutosave("level3");
      renderSubmitState("level3");
    };
  });

  var submitLevelBtn = document.getElementById("submitLevelBtn");
  if(submitLevelBtn) submitLevelBtn.onclick = async function(){
    var key = submitLevelBtn.getAttribute("data-level");
    if(!levelIsComplete(key)) return;
    var payload = {};
    payload[key] = { completed:true, submittedAt: Date.now(), draft: draftCache[key] };
    await persistUpdate(participant.id, payload);
    showToast("Submitted!");
    if(allDone(participant)){ screen = "complete"; }
    else { screen = "dashboard"; }
    render();
  };

  /* ---------- content editor handlers ---------- */
  if(researcherTab === "content" && contentDraft){
    app.querySelectorAll("[data-edit]").forEach(function(inp){
      inp.oninput = function(){
        var key = inp.getAttribute("data-edit");
        var m;
        if(m = key.match(/^l1img-id-(\d+)$/)) contentDraft.level1.images[+m[1]].id = inp.value;
        else if(m = key.match(/^l1desc-(\d+)$/)) contentDraft.level1.descriptions[+m[1]].text = inp.value;
        else if(m = key.match(/^l2img-id-(\d+)$/)) contentDraft.level2.images[+m[1]].id = inp.value;
        else if(m = key.match(/^l3img-id-(\d+)$/)) contentDraft.level3.images[+m[1]].id = inp.value;
        else if(m = key.match(/^l3opt-(\d+)-(\d+)$/)) contentDraft.level3.images[+m[1]].options[+m[2]].text = inp.value;
      };
    });

    app.querySelectorAll("[data-upload]").forEach(function(inp){
      inp.onchange = async function(){
        var file = inp.files[0];
        if(!file) return;
        var key = inp.getAttribute("data-upload");
        var m;
        showToast("Processing image\u2026");
        try{
          var url = await fileToResizedDataUrl(file);
          if(m = key.match(/^l1img-(\d+)$/)) contentDraft.level1.images[+m[1]].img = url;
          else if(m = key.match(/^l2img-(\d+)$/)) contentDraft.level2.images[+m[1]].img = url;
          else if(m = key.match(/^l3img-(\d+)$/)) contentDraft.level3.images[+m[1]].img = url;
          showToast("Image ready \u2014 click Save Changes to publish");
          render();
        }catch(e){ console.error(e); showToast("Couldn't process that image"); }
      };
    });

    app.querySelectorAll("[data-remove]").forEach(function(btn){
      btn.onclick = function(){
        var key = btn.getAttribute("data-remove");
        var m;
        if(m = key.match(/^l1img-(\d+)$/)) contentDraft.level1.images.splice(+m[1],1);
        else if(m = key.match(/^l1desc-(\d+)$/)) contentDraft.level1.descriptions.splice(+m[1],1);
        else if(m = key.match(/^l2img-(\d+)$/)) contentDraft.level2.images.splice(+m[1],1);
        else if(m = key.match(/^l3img-(\d+)$/)) contentDraft.level3.images.splice(+m[1],1);
        else if(m = key.match(/^l3opt-(\d+)-(\d+)$/)) contentDraft.level3.images[+m[1]].options.splice(+m[2],1);
        render();
      };
    });

    app.querySelectorAll("[data-add]").forEach(function(btn){
      btn.onclick = function(){
        var key = btn.getAttribute("data-add");
        var m;
        if(m = key.match(/^l3opt-(\d+)$/)){
          var n = contentDraft.level3.images[+m[1]].options.length + 1;
          contentDraft.level3.images[+m[1]].options.push({id:"o"+Date.now(), text:"New option " + n});
        }
        render();
      };
    });

    var addL1Img = document.getElementById("addL1Img");
    if(addL1Img) addL1Img.onclick = function(){
      contentDraft.level1.images.push({id:"img"+Date.now(), img: placeholderImg('#6b7280','square','New Image')});
      render();
    };
    var addL1Desc = document.getElementById("addL1Desc");
    if(addL1Desc) addL1Desc.onclick = function(){
      contentDraft.level1.descriptions.push({id:"d"+Date.now(), text:"New description"});
      render();
    };
    var addL2Img = document.getElementById("addL2Img");
    if(addL2Img) addL2Img.onclick = function(){
      contentDraft.level2.images.push({id:"img"+Date.now(), img: placeholderImg('#6b7280','blob','New Image')});
      render();
    };
    var addL3Img = document.getElementById("addL3Img");
    if(addL3Img) addL3Img.onclick = function(){
      contentDraft.level3.images.push({id:"img"+Date.now(), img: placeholderImg('#6b7280','triangle','New Image'), options:[{id:"o1",text:"Option 1"},{id:"o2",text:"Option 2"}]});
      render();
    };

    var saveContentBtn = document.getElementById("saveContentBtn");
    if(saveContentBtn) saveContentBtn.onclick = async function(){
      saveContentBtn.disabled = true;
      try{
        await saveStudyConfig(contentDraft);
        contentDraft = null;
        showToast("Content saved \u2014 live for everyone now");
        render();
      }catch(e){ console.error(e); showToast("Save failed \u2014 check console"); saveContentBtn.disabled = false; }
    };
    var discardContentBtn = document.getElementById("discardContentBtn");
    if(discardContentBtn) discardContentBtn.onclick = function(){
      contentDraft = cloneStudy(STUDY);
      showToast("Changes discarded");
      render();
    };
  }
}

function renderSubmitState(key){
  var btn = document.getElementById("submitLevelBtn");
  if(btn && btn.getAttribute("data-level")===key){
    btn.disabled = !levelIsComplete(key);
  }
}

init();
</script>
